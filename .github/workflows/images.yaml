name: Container Image Build and Push

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  # On PRs, the jobs below run in build-only mode (push: false, single-arch)
  # so a broken Dockerfile or build context is caught before a release tag.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # Spelled out rather than derived from github.repository so the published
  # names stay pinned to the chart values (ghcr.io/faroshq/faros-{hub,agent})
  # regardless of what the repository is called. Matches helm-images.yaml and
  # the provider matrix below, which all use repository_owner + a literal name.
  HUB_IMAGE_NAME: ${{ github.repository_owner }}/faros-hub
  AGENT_IMAGE_NAME: ${{ github.repository_owner }}/faros-agent

jobs:
  build-and-push-hub-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HUB_IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.hub
          # Multi-arch on release; single-arch build-only on PRs (no QEMU emulation cost).
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.release.created_at }}

  # PR-only validation that every provider Dockerfile + build context still
  # builds, before the split sync ever reaches a mirror. Each provider is a
  # self-contained build context (providers/<name>/). These builds are NEVER
  # pushed here — provider images are published per-provider, stamped with the
  # provider's own version, by provider-release.yaml on a `providers/<name>/v*`
  # tag. (Publishing here would tag provider images with the hub version.)
  build-and-push-provider-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quickstart
            image: ${{ github.repository_owner }}/faros-quickstart-provider
          - name: infrastructure
            image: ${{ github.repository_owner }}/faros-infrastructure-provider
          - name: code
            image: ${{ github.repository_owner }}/faros-code-provider
          - name: kuery
            image: ${{ github.repository_owner }}/faros-kuery-provider
          - name: app-studio
            image: ${{ github.repository_owner }}/faros/app-studio-provider
          - name: databricks
            image: ${{ github.repository_owner }}/faros-databricks-provider
          - name: agents
            image: ${{ github.repository_owner }}/faros-agents-provider
          - name: edges
            image: ${{ github.repository_owner }}/faros-edges-provider
          # Companion image of the infrastructure provider (the dev-agent its
          # kro backend injects into development-mode pods); published by
          # provider-release.yaml on the infrastructure provider's tag.
          - name: infrastructure/dev-agent
            image: ${{ github.repository_owner }}/faros-dev-agent
            # Self-contained Dockerfile with module-local paths — keeps its
            # own context (no provider-sdk dependency).
            context: ./providers/infrastructure/dev-agent
          # Second infrastructure companion: the access gate every publishable
          # template renders in front of its app. Non-default Dockerfile in the
          # provider module root, hence the explicit context/dockerfile.
          - name: access-proxy
            image: ${{ github.repository_owner }}/faros-access-proxy
            # Shares the infrastructure go.mod, which resolves provider-sdk
            # in-tree — repo-root context like every provider image.
            context: .
            dockerfile: ./providers/infrastructure/Dockerfile.access-proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Repo-root context by default: provider modules resolve the
          # in-tree provider-sdk via a go.mod replace and their Dockerfiles
          # copy it into the build (docker build -f providers/<n>/Dockerfile .).
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile || format('./providers/{0}/Dockerfile', matrix.name) }}
          # Multi-arch on release; single-arch build-only on PRs (no QEMU emulation cost).
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=provider-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=provider-${{ matrix.name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-agent-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.agent
          # Multi-arch on release; single-arch build-only on PRs (no QEMU emulation cost).
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.release.created_at }}
