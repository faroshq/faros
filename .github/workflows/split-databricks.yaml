name: Split databricks provider

# Publishes providers/databricks from this monorepo to the standalone,
# read-only mirror at faroshq/provider-databricks, preserving git history.
# The mirror is source-only; provider images and Helm charts are published by
# provider-release.yaml from providers/databricks/vX.Y.Z tags.
#
# Required secret: DATABRICKS_DEPLOY_KEY
#   An SSH private key whose public half is added as a write deploy key on
#   faroshq/provider-databricks. Deploy keys are scoped to one mirror.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'providers/databricks/**'
      - '.github/workflows/split-databricks.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: split-databricks-${{ github.ref }}
  cancel-in-progress: false

env:
  PREFIX: providers/databricks
  TARGET_REPO: git@github.com:faroshq/provider-databricks.git
  TARGET_BRANCH: main
  SPLITSH_VERSION: v1.0.1

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install splitsh-lite
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/splitsh/lite/releases/download/${SPLITSH_VERSION}/lite_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" ./splitsh-lite
          chmod +x "$HOME/.local/bin/splitsh-lite"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up SSH deploy key
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_split
          echo "${{ secrets.DATABRICKS_DEPLOY_KEY }}" > ~/.ssh/id_split
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_split
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Compute split
        run: |
          set -euo pipefail
          splitsh-lite --prefix="${PREFIX}" --origin=HEAD | tee /tmp/split-sha
          SHA="$(tail -n1 /tmp/split-sha)"
          [ -n "${SHA}" ] || { echo "split produced no sha"; exit 1; }
          echo "Split sha: ${SHA}"
          echo "SPLIT_SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Push to mirror
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git remote add mirror "${TARGET_REPO}"
          git push --force mirror "${SPLIT_SHA}:refs/heads/${TARGET_BRANCH}"
