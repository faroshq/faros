name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Build
      run: make build

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Test
      run: make test
    - name: Test Infrastructure install package
      run: cd providers/infrastructure && go test -count=1 ./install

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Lint
      run: make lint

  verify-boilerplate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify boilerplate
      run: make verify-boilerplate

  verify-portalkit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify portalkit is synced
      run: make verify-portalkit

  verify-ui-conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify provider UI conformance
      run: make verify-ui-conformance

  verify-codegen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Verify codegen
      run: make verify-codegen

  verify-tilt-browser-deployment:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Tilt browser deployment wiring
      run: make verify-tilt-browser-deployment

  # The root portal is a separate npm project from the standalone provider
  # portals below. Its production build runs vue-tsc first, so this single job
  # covers both the root typecheck and the generated Vite bundle.
  portal:
    name: Root portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install root portal dependencies
        run: npm ci --no-audit --no-fund

      - name: Test root portal
        run: npm test

      - name: Build root portal
        run: npm run build

  # Standalone provider portals are separate npm projects and are not covered
  # by the root Go test target. Providers with a prebuild hook already run
  # their test/typecheck contract as part of `npm run build`, so those matrix
  # entries skip duplicate invocations below.
  provider-portals:
    name: Provider portal (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: agents
            test: true
            typecheck: true
          - provider: app-studio
            test: true
            typecheck: true
          - provider: code
            test: false
            typecheck: false
          - provider: databricks
            test: true
            typecheck: true
          - provider: edges
            test: true
            typecheck: true
          - provider: infrastructure
            test: false
            typecheck: false
          - provider: kuery
            test: true
            typecheck: true
          - provider: quickstart
            test: false
            typecheck: true
    defaults:
      run:
        working-directory: providers/${{ matrix.provider }}/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: providers/${{ matrix.provider }}/portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci --no-audit --no-fund

      - name: Test portal
        if: matrix.test
        run: npm test

      - name: Typecheck portal
        if: matrix.typecheck
        run: npm run typecheck

      - name: Build portal
        run: npm run build
