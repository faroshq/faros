name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Build
      run: make build

  # Every production Go module gets its own vet + race-test run. provider-sdk
  # and each provider under providers/ are standalone modules (AGENTS.md §2), so
  # the root `make test` never saw them — security fixes landing in
  # providers/edges, providers/agents or pkg/agent need this gate.
  #
  # No go.work is needed: every provider go.mod carries
  # `replace github.com/faroshq/provider-sdk => ../../provider-sdk`, so the
  # in-tree SDK is what gets linked. When hack/provider-sdk-cutover.sh drops
  # that replace, copy the "Set up Go workspace" step from e2e.yaml into this
  # job, or it will silently test the published SDK instead of the diff.
  test-modules:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: ., race: -race }
          - { module: provider-sdk, race: -race }
          - { module: providers/agents, race: -race }
          - { module: providers/app-studio, race: -race }
          - { module: providers/code, race: -race }
          - { module: providers/databricks, race: -race }
          - { module: providers/edges, race: -race }
          - { module: providers/infrastructure, race: -race }
          - { module: providers/infrastructure/dev-agent, race: -race }
          - { module: providers/kuery, race: -race }
          - { module: providers/quickstart, race: -race }
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'

    # Provider binaries `//go:embed all:portal/dist`. The portal is a separate
    # npm project built by the provider-portals job and the image build, so
    # give the embed a target here instead of building every portal twice —
    # `all:` accepts a lone dotfile, an empty directory is a compile error.
    - name: Stub portal/dist for go:embed
      if: startsWith(matrix.module, 'providers/') && matrix.module != 'providers/infrastructure/dev-agent'
      working-directory: ${{ matrix.module }}
      run: mkdir -p portal/dist && touch portal/dist/.gitkeep

    - name: Vet
      working-directory: ${{ matrix.module }}
      run: go vet ./...

    - name: Test
      working-directory: ${{ matrix.module }}
      run: |
        if [ "${{ matrix.module }}" = "." ]; then
          # Same package set as `make test`: everything except test/e2e.
          go test ${{ matrix.race }} -count=1 $(go list ./... | grep -v '/test/e2e')
        else
          go test ${{ matrix.race }} -count=1 ./...
        fi

  postgres-contracts:
    name: PostgreSQL persistence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faros_test
          POSTGRES_PASSWORD: faros_test
          POSTGRES_DB: faros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faros_test -d faros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'
    - name: Run required database contracts without skips
      env:
        AGENTS_TEST_POSTGRES_DSN: postgres://faros_test:faros_test@127.0.0.1:5432/faros_test?sslmode=disable
        APP_STUDIO_TEST_POSTGRES_DSN: postgres://faros_test:faros_test@127.0.0.1:5432/faros_test?sslmode=disable
        KUERY_TEST_POSTGRES_DSN: postgres://faros_test:faros_test@127.0.0.1:5432/faros_test?sslmode=disable
        FAROS_TEST_ARTIFACT_DIR: ${{ runner.temp }}/postgres-contracts
      run: make test-postgres-contracts
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: postgres-contract-results
        path: ${{ runner.temp }}/postgres-contracts/
        if-no-files-found: ignore

  edges-replica-contract:
    name: Edges replica convergence (real Kubernetes API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'
    # This bounded topology needs one API server, not the full multi-shard
    # Tilt/operator stack. The two replica registries share real Lease storage.
    - uses: helm/kind-action@v1
      with:
        cluster_name: faros-replica-contract
        wait: 180s
    - name: Export an explicit disposable-cluster kubeconfig
      run: kind get kubeconfig --name faros-replica-contract > "${RUNNER_TEMP}/replica.kubeconfig"
    - name: Verify recovery and takeover with two replica registries
      env:
        EDGES_REPLICA_TEST_KUBECONFIG: ${{ runner.temp }}/replica.kubeconfig
        FAROS_TEST_ARTIFACT_DIR: ${{ runner.temp }}/edges-replica-contract
      run: make test-edges-replica-contract
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: edges-replica-contract-results
        path: ${{ runner.temp }}/edges-replica-contract/
        if-no-files-found: ignore

  # govulncheck per module, blocking. hack/govulncheck.sh fails the job only on
  # vulnerabilities govulncheck traced to a *called* symbol and that are not
  # listed in hack/govulncheck-allow.yaml; module- and package-level findings
  # are inventory, not exploitable paths, and plain `govulncheck ./...` cannot
  # tell CI the difference because it exits 3 for both.
  #
  # The allowlist is the only way to accept a reachable finding, every entry
  # carries a reason, an exposure argument and a review-by date, and it is
  # reserved for advisories with no upstream fix. If this job goes red, read the
  # output: it names the module, the fixed version and the `go get` line, or
  # says there is no fix. Do not add continue-on-error back.
  #
  # govulncheck is installed at @latest, so a newly published advisory can turn
  # this red on an unrelated PR. That is intended - it is how we hear about one.
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - provider-sdk
          - providers/agents
          - providers/app-studio
          - providers/code
          - providers/databricks
          - providers/edges
          - providers/infrastructure
          - providers/kuery
          - providers/quickstart
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    # The script stubs portal/dist for the go:embed itself and cleans up after.
    - name: govulncheck
      run: ./hack/govulncheck.sh ${{ matrix.module }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Lint
      run: make lint

  verify-boilerplate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify boilerplate
      run: make verify-boilerplate

  verify-portalkit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify portalkit is synced
      run: make verify-portalkit

  verify-ui-conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify provider UI conformance
      run: make verify-ui-conformance

  verify-design-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify design-document metadata
      run: make verify-design-docs

  verify-codegen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Verify codegen
      run: make verify-codegen

  verify-tilt-browser-deployment:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Tilt browser deployment wiring
      run: make verify-tilt-browser-deployment

  # The root portal is a separate npm project from the standalone provider
  # portals below. Its production build runs vue-tsc first, so this single job
  # covers both the root typecheck and the generated Vite bundle.
  portal:
    name: Root portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install root portal dependencies
        run: npm ci --no-audit --no-fund

      - name: Test root portal
        run: npm test

      - name: Build root portal
        run: npm run build

  # Standalone provider portals are separate npm projects and are not covered
  # by the root Go test target. Providers with a prebuild hook already run
  # their test/typecheck contract as part of `npm run build`, so those matrix
  # entries skip duplicate invocations below.
  provider-portals:
    name: Provider portal (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: agents
            test: true
            typecheck: true
          - provider: app-studio
            test: true
            typecheck: true
          - provider: code
            test: false
            typecheck: false
          - provider: databricks
            test: true
            typecheck: true
          - provider: edges
            test: true
            typecheck: true
          - provider: infrastructure
            test: false
            typecheck: false
          - provider: kuery
            test: true
            typecheck: true
          - provider: quickstart
            test: false
            typecheck: true
    defaults:
      run:
        working-directory: providers/${{ matrix.provider }}/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: providers/${{ matrix.provider }}/portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci --no-audit --no-fund

      - name: Test portal
        if: matrix.test
        run: npm test

      - name: Typecheck portal
        if: matrix.typecheck
        run: npm run typecheck

      - name: Build portal
        run: npm run build
