project_name: kubectl-faros
version: 2
env:
  - CGO_ENABLED=0
  - LDFLAGS={{ .Env.LDFLAGS }}

builds:
  - id: kubectl-faros
    dir: cmd/faros
    binary: kubectl-faros
    ldflags: "{{ .Env.LDFLAGS }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - ppc64le
    ignore:
      - goos: darwin
        goarch: ppc64le
      - goos: windows
        goarch: ppc64le

archives:
  - id: kubectl-faros-plugin
    ids:
    - kubectl-faros
    # uname-compatible names so `curl .../kubectl-faros_$(uname -s)_$(uname -m).tar.gz`
    # resolves: title-case OS (Linux/Darwin/Windows) and map Go's arch names to
    # what `uname -m` reports — amd64→x86_64 everywhere, arm64→aarch64 on Linux
    # (macOS keeps arm64), 386→i386.
    name_template: >-
      kubectl-faros_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if and (eq .Arch "arm64") (eq .Os "linux") }}aarch64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

release:
  prerelease: auto
  mode: keep-existing
  github:
    owner: faroshq

blobs:
  - provider: s3
    endpoint: https://d7fc6dd1a6252d2a0ea1a629770cd3a8.r2.cloudflarestorage.com
    region: auto
    ids:
    - kubectl-faros-plugin
    bucket: faros
    directory: "cli/faros/{{.Tag}}"

krews:
- name: faros
  ids:
  - kubectl-faros-plugin
  repository:
    owner: faroshq
    name: krew-index
    token: "{{ .Env.KREW_GITHUB_TOKEN }}"
  homepage: "https://faros.sh/"
  url_template: "https://downloads.faros.sh/cli/faros/{{ .Tag }}/{{ .ArtifactName }}"
  description: |
    Manage faros edges and workloads from the command line.
    kubectl faros login - Log in to a faros hub
    kubectl faros ws - Navigate kcp workspaces
    kubectl faros edge - Manage edges
  short_description: "Manage faros edges and workloads from the command line."
  skip_upload: auto
