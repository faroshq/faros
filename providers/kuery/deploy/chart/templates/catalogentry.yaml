{{- if .Values.catalogEntry.enabled -}}
# CatalogEntry registers this provider with the faros hub for routing + the
# portal Enable flow. It is a kcp resource (providers.faros.sh/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (FAROS_CATALOGENTRY_FILE -> sdkinstall.Bootstrap). The hub watches
# CatalogEntries in every workspace bound to providers.faros.sh, including
# the provider's own, so a self-registered entry is seen.
#
# It only REFERENCES the APIExport (apiExport.name); the APIExport, its
# APIResourceSchemas, the APIExportEndpointSlice, and the bind grant are created
# by the same init container. The hub no longer provisions anything from this
# CatalogEntry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kuery.fullname" . }}-catalogentry
  labels:
    {{- include "kuery.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.faros.sh/v1alpha1
    kind: CatalogEntry
    metadata:
      name: kuery
    spec:
      displayName: "Kuery"
      description: "Fleet-wide object search, relationships, and impact analysis across connected edge clusters."
      vendor: "faros"
      version: {{ .Chart.AppVersion | quote }}
      category: "Observability"
      iconURL: "/ui/providers/kuery/icon.svg"
      ui:
        url: "http://{{ include "kuery.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
      backend:
        url: "http://{{ include "kuery.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/healthz"

      # Kuery's engagement controller opens BACKGROUND connections to the
      # tenant's edge clusters through the hub's edges-proxy (informer sync).
      # On Enable the hub grants the provider SA the "proxy" verb on edges in
      # the tenant workspace; removed again on Disable.
      edgeProxyAccess: true

      apiExport:
        name: "kuery.providers.faros.sh"
        # The engagement controller watches the tenant's KubernetesCluster
        # edges (via the APIExport virtual workspace) to know which edges to
        # engage/disengage. LinuxServer edges carry no Kubernetes API and are
        # not claimed. First-party claim: the init container stamps its
        # identityHash from apiExport.edgesIdentityHash (Helm value, copied
        # from /bonkers).
        permissionClaims:
          - resource: kubernetesclusters
            group: edges.faros.sh
            verbs: [get, list, watch]
            tenantScoped: true
      # Lets an organization run this provider in its own cluster
      # (docs/byo-providers.md). Keep manifest.yaml and
      # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
      # one that reaches production.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/faroshq/charts"
          name: "faros-kuery-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "faros-provider-kuery"
        releaseName: "kuery"
        docsURL: "https://github.com/faroshq/faros/blob/main/providers/kuery/deploy/chart/README.md"
        # The chart carries its own values reference, so the portal can show it
        # offline and for the version actually installed.
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
        requiredValues:
          - name: apiExport.edgesIdentityHash
            identityFor: "edges.providers.faros.sh"
            description: >-
              kcp identity hash of the edges APIExport kuery claims against. Resolved for you; a wrong value leaves kuery running but seeing no edges.
{{- end }}
