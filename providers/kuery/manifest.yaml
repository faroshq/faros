# Kuery provider — register with the faros hub.
#
# Kuery gives tenants (and AI agents via MCP) a single query surface over
# every object across their connected edge clusters: fleet-wide search,
# relationship traversal, and impact analysis. See
# docs/kuery-provider-architecture.md in the faros repo for the design.
#
# Apply this against the kcp workspace where the faros.sh APIExport is
# bound (typically root:faros:providers when running embedded kcp for
# development):
#
#   kubectl --kubeconfig kcp-admin.kubeconfig apply -f manifest.yaml
#
# For local dev with the provider binary running on the host machine the
# URLs below point at the loopback the hub can reach. For in-cluster
# deployment, the Helm chart renders the Service DNS instead, e.g.
#   url: http://kuery.kuery.svc.cluster.local:8081
---
apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: kuery
spec:
  displayName: "Kuery"
  description: "Fleet-wide object search, relationships, and impact analysis across connected edge clusters."
  vendor: "faros"
  version: "0.1.0"
  category: "Observability"
  iconURL: "/ui/providers/kuery/icon.svg"
  ui:
    # Dev loopback port (KUERY_PORT / Tiltfile run-provider-kuery). Must be
    # 8084, not 8081 — quickstart owns 8081, and the hub reverse-proxies the
    # portal bundle here; pointing at 8081 serves quickstart's bundle and the
    # faros-provider-kuery custom element never registers.
    url: "http://localhost:8084"
    indexPath: "/"
  backend:
    url: "http://localhost:8084"
    healthPath: "/healthz"

  # Kuery's engagement controller opens BACKGROUND connections to the
  # tenant's edge clusters through the hub's edges-proxy (informer sync).
  # This flag asks the hub to grant the provider SA the "proxy" verb on
  # edges in the tenant workspace when the tenant clicks Enable; the
  # Enable dialog surfaces the request. Removed again on Disable.
  edgeProxyAccess: true

  apiExport:
    name: "kuery.providers.faros.sh"
    # The engagement controller watches the tenant's KubernetesCluster edges
    # (via the APIExport virtual workspace) to know which edges to
    # engage/disengage. LinuxServer edges carry no Kubernetes API and are
    # not claimed.
    permissionClaims:
      - resource: kubernetesclusters
        group: edges.faros.sh
        verbs: [get, list, watch]
        tenantScoped: true
  # Lets an organization run this provider in its own cluster
  # (docs/byo-providers.md). Keep manifest.yaml and
  # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
  # one that reaches production.
  selfHosting:
    supported: true
    chart:
      repository: "oci://ghcr.io/faroshq/charts"
      name: "faros-kuery-provider"
    namespace: "faros-provider-kuery"
    releaseName: "kuery"
    docsURL: "https://github.com/faroshq/faros/blob/main/providers/kuery/deploy/chart/README.md"
    requiredValues:
      - name: apiExport.edgesIdentityHash
        identityFor: "edges.providers.faros.sh"
        description: >-
          kcp identity hash of the edges APIExport kuery claims against. Resolved for you; a wrong value leaves kuery running but seeing no edges.
