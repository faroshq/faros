apiVersion: v2
name: faros-code-provider
description: |
  faros provider that manages source-code repositories and access (deploy
  keys, collaborators) across git hosting providers (GitHub today). Ships the
  provider Deployment, ClusterIP Service, and the CatalogEntry that registers
  the provider — with its four tenant-authored APIResourceSchemas — with the
  faros hub.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - faros
  - code
  - git
  - github
  - repositories
home: https://github.com/faroshq/faros
sources:
  - https://github.com/faroshq/faros/tree/main/providers/code
maintainers:
  - name: faros maintainers
