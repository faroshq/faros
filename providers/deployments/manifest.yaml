apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: deployments
spec:
  displayName: "Deployments"
  description: "Sync reviewed repository desired state into tenant workspaces."
  vendor: "faros"
  version: "0.1.0"
  category: "Developer"
  dependencies:
    - name: code
  iconURL: "/ui/providers/deployments/icon.svg"
  ui:
    url: "http://localhost:8093"
    indexPath: "/"
  backend:
    url: "http://localhost:8093"
    healthPath: "/readyz"
  apiExport:
    name: "deployments.faros.sh"
    permissionClaims:
      - group: code.faros.sh
        resource: repositorycheckouts
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
        purpose: "Read bounded repository checkouts for desired-state sync."
      - group: infrastructure.faros.sh
        resource: instances
        verbs: [get, create, update, patch, delete]
        tenantScoped: true
        optional: true
        purpose: "Apply Infrastructure instances from repository syncs."
      - group: ""
        resource: configmaps
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
        optional: true
        purpose: "Apply ConfigMaps from repository syncs."
