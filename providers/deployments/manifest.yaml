apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: deployments
spec:
  displayName: "Deployments"
  description: "Reconcile immutable application releases into production runtimes."
  vendor: "faros"
  version: "0.1.0"
  category: "Developer"
  dependencies:
    - name: code
    - name: infrastructure
  iconURL: "/ui/providers/deployments/icon.svg"
  ui:
    url: "http://localhost:8093"
    indexPath: "/"
  backend:
    url: "http://localhost:8093"
    healthPath: "/readyz"
  apiExport:
    name: "deployments.faros.sh"
    permissionClaims:
      - group: infrastructure.faros.sh
        resource: instances
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
      - group: code.faros.sh
        resource: repositorycheckouts
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
