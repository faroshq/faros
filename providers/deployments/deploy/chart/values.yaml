image:
  repository: ghcr.io/faroshq/faros-deployments-provider
  tag: ""
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  port: 8093
providerKubeconfig:
  secretName: faros-provider-kubeconfig
# Run the provider bootstrap init container. Disable only when an external
# workflow has already initialized the provider workspace and supplied the
# resulting runtime kubeconfig (the Tilt cluster flow does this explicitly).
bootstrap:
  enabled: true
# Optional identity hash for the first advertised target capability. Omit when
# Infrastructure is not installed; Deployments still syncs other authorized APIs.
infrastructureIdentityHash: ""
codeIdentityHash: ""
code:
  url: http://code.code.svc.cluster.local:8083
serviceAccount:
  create: true
  name: ""
hub:
  url: https://faros-hub.faros.svc.cluster.local:9443
  tokenSecretRef:
    name: faros-deployments-hub-token
    key: token
  insecure: false
catalogEntry:
  enabled: true
nameOverride: ""
fullnameOverride: ""
resources: {}
