{{- if .Values.catalogEntry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deployments.fullname" . }}-catalogentry
data:
  catalogentry.yaml: |
    apiVersion: providers.faros.sh/v1alpha1
    kind: CatalogEntry
    metadata:
      name: deployments
    spec:
      displayName: "Deployments"
      description: "Reconcile immutable application releases into production runtimes."
      vendor: "faros"
      version: {{ .Chart.AppVersion | quote }}
      category: "Developer"
      backend:
        url: "http://{{ include "deployments.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/readyz"
      apiExport:
        name: "deployments.faros.sh"
        permissionClaims:
          - group: infrastructure.faros.sh
            resource: templates
            verbs: [get, list, watch]
            tenantScoped: true
          - group: infrastructure.faros.sh
            resource: applications
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          - group: infrastructure.faros.sh
            resource: simplewebapps
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          - group: infrastructure.faros.sh
            resource: workers
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
{{- end }}
