# Provider — declarative provisioning record (admin.kedge.faros.sh, admin-only).
# Applied into root:kedge:system:providers. The hub's Provider controller creates
# the provider sub-workspace (root:kedge:providers:vibe-studio), its "provider"
# ServiceAccount, and writes a kubeconfig Secret (vibe-studio-kubeconfig) into
# root:kedge:system:providers. The APIExport/schemas/bind-grant come from the
# provider's own `init`; routing/UI from the companion CatalogEntry.
apiVersion: admin.kedge.faros.sh/v1alpha1
kind: Provider
metadata:
  name: vibe-studio
spec:
  displayName: "Vibe Studio"
