# vibe-studio provider — register with the faros hub (local dev variant).
# In-cluster deployments render this CatalogEntry from the chart
# (deploy/chart/templates/catalogentry.yaml); this file serves host-machine
# dev where the binary runs on localhost and the hub proxies in front.
apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: vibe-studio
spec:
  displayName: "Vibe Studio"
  description: "Wizard-first app builder: describe your app, get a template-grounded live sandbox, vibe, then ship."
  vendor: "faros"
  version: "0.1.0"
  category: "Build"
  iconURL: "/ui/providers/vibe-studio/icon.svg"
  ui:
    url: "http://localhost:8089"
    indexPath: "/"
  backend:
    url: "http://localhost:8089"
    healthPath: "/healthz"
  # Provider-owned APIExport (Project CRD) + claims on the infrastructure
  # instance resources the Project reconciler lifecycles in tenant workspaces.
  # The identityHash for these first-party claims is stamped on the APIExport
  # by `init` (VIBE_STUDIO_INFRA_IDENTITY_HASH); the CatalogEntry lists them
  # for the Enable dialog only.
  apiExport:
    name: "vibe.faros.sh"
    # Static API surface the init command must publish before the hub offers
    # this provider for Enable. Runtime-added resources may extend this set.
    requiredResources:
      - group: vibe.faros.sh
        name: models
      - group: vibe.faros.sh
        name: projects
      - group: vibe.faros.sh
        name: sessions
      - group: vibe.faros.sh
        name: studios
    permissionClaims:
      - resource: applications
        group: infrastructure.faros.sh
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      - resource: simplewebapps
        group: infrastructure.faros.sh
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      - resource: workers
        group: infrastructure.faros.sh
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      # Web search: every project binds a private searxng instance so the
      # assistant can look things up instead of asking the user to paste.
      - resource: searxngs
        group: infrastructure.faros.sh
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      - resource: repositories
        group: code.faros.sh
        verbs: [get, list, watch, create, update, patch]
        tenantScoped: true
        identitySource: {kind: Provider, provider: code}
      - resource: serviceaccounts
        verbs: [get, list, watch, create, delete]
        tenantScoped: true
      - resource: secrets
        verbs: [get, list, watch, create, update, delete]
        tenantScoped: true
      - resource: clusterroles
        group: rbac.authorization.k8s.io
        verbs: [get, list, watch, create, update, delete]
        tenantScoped: true
      - resource: clusterrolebindings
        group: rbac.authorization.k8s.io
        verbs: [get, list, watch, create, update, delete]
        tenantScoped: true
