# vibe-studio provider — register with the faros hub (local dev variant).
# In-cluster deployments render this CatalogEntry from the chart
# (deploy/chart/templates/catalogentry.yaml); this file serves host-machine
# dev where the binary runs on localhost and the hub proxies in front.
apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: vibe-studio
spec:
  displayName: "Vibe Studio"
  description: "Wizard-first app builder: describe your app, get a template-grounded live sandbox, vibe, then ship."
  vendor: "faros"
  version: "0.1.0"
  category: "Build"
  iconURL: "/ui/providers/vibe-studio/icon.svg"
  ui:
    url: "http://localhost:8089"
    indexPath: "/"
  backend:
    url: "http://localhost:8089"
    healthPath: "/healthz"
  # Provider-owned APIExport (Project CRD) + claims on the infrastructure
  # instance resources the Project reconciler lifecycles in tenant workspaces.
  # The identityHash for these first-party claims is stamped on the APIExport
  # by `init` (VIBE_STUDIO_INFRA_IDENTITY_HASH); the CatalogEntry lists them
  # for the Enable dialog only.
  apiExport:
    name: "vibe.faros.sh"
    permissionClaims:
      # Every infrastructure template's instances are one flattened resource
      # (product selected by spec.template), so one claim covers the runtime
      # app, workers, and the per-project searxng search backend alike.
      - resource: instances
        group: infrastructure.faros.sh
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
      - resource: repositories
        group: code.faros.sh
        verbs: [get, list, watch, create, update, patch]
        tenantScoped: true
      - resource: serviceaccounts
        verbs: [get, list, watch, create, delete]
        tenantScoped: true
      - resource: secrets
        verbs: [get, list, watch, create, update, delete]
        tenantScoped: true
      - resource: clusterroles
        group: rbac.authorization.k8s.io
        verbs: [get, list, watch, create, update, delete]
        tenantScoped: true
      - resource: clusterrolebindings
        group: rbac.authorization.k8s.io
        verbs: [get, list, watch, create, update, delete]
        tenantScoped: true
  # Lets an organization run this provider in its own cluster
  # (docs/byo-providers.md). Keep manifest.yaml and
  # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
  # one that reaches production.
  selfHosting:
    supported: true
    chart:
      repository: "oci://ghcr.io/faroshq/charts"
      name: "faros-vibe-studio-provider"
    namespace: "faros-provider-vibe-studio"
    releaseName: "vibe-studio"
    docsURL: "https://github.com/faroshq/faros/blob/main/providers/vibe-studio/deploy/chart/README.md"
    requiredValues:
      - name: apiExport.infraIdentityHash
        identityFor: "infrastructure.providers.faros.sh"
        description: >-
          Identity hash of the Application Templates APIExport, needed to lifecycle instances.
      - name: apiExport.codeIdentityHash
        identityFor: "code.providers.faros.sh"
        description: >-
          Identity hash of the code APIExport, needed for repository access.
