apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vibe-studio.fullname" . }}
  labels:
    {{- include "vibe-studio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vibe-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vibe-studio.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vibe-studio.serviceAccountName" . }}
      initContainers:
        # Bootstrap the provider workspace (schemas, APIExport, slice, bind
        # grant) with the onboarded workspace-admin kubeconfig. Schemas baked
        # at /etc/faros/schemas (Dockerfile). Idempotent.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            - name: FAROS_SCHEMAS_DIR
              value: /etc/faros/schemas
            - name: VIBE_STUDIO_INFRA_IDENTITY_HASH
              value: {{ .Values.apiExport.infraIdentityHash | quote }}
            - name: VIBE_STUDIO_CODE_IDENTITY_HASH
              value: {{ .Values.apiExport.codeIdentityHash | quote }}
            {{- if .Values.catalogEntry.enabled }}
            - name: FAROS_CATALOGENTRY_FILE
              value: /etc/faros/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: faros-provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/faros/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: "8081"
            - name: FAROS_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: FAROS_PROVIDER_NAME
              value: "vibe-studio"
            # The Project reconciler (multicluster controller manager) needs
            # the provider-workspace kubeconfig at serve time too.
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            {{- if .Values.hub.insecure }}
            - name: FAROS_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: FAROS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
            {{- if .Values.database.dsnSecretRef.name }}
            - name: VIBE_STUDIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.dsnSecretRef.name }}
                  key: {{ .Values.database.dsnSecretRef.key }}
            {{- end }}
          volumeMounts:
            - name: faros-provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: faros-provider-kubeconfig
          secret:
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: faros-provider-kubeconfig
        {{- if .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "vibe-studio.fullname" . }}-catalogentry
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
