{{- if .Values.catalogEntry.enabled -}}
# CatalogEntry registers this provider with the faros hub for routing + the
# portal Enable flow. It is a kcp resource, so it MUST NOT be applied to the
# hosting cluster: the chart renders it into a ConfigMap that the init
# container mounts and applies into the provider workspace via the provider
# kubeconfig (FAROS_CATALOGENTRY_FILE -> sdkinstall.Bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vibe-studio.fullname" . }}-catalogentry
  labels:
    {{- include "vibe-studio.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.faros.sh/v1alpha1
    kind: CatalogEntry
    metadata:
      name: vibe-studio
    spec:
      displayName: "Vibe Studio"
      description: "Wizard-first app builder: describe your app, get a template-grounded live sandbox, vibe, then ship."
      vendor: "faros"
      version: {{ .Chart.AppVersion | quote }}
      category: "Build"
      iconURL: "/ui/providers/vibe-studio/icon.svg"
      ui:
        url: "http://{{ include "vibe-studio.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
      backend:
        url: "http://{{ include "vibe-studio.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/healthz"
      apiExport:
        name: "vibe.faros.sh"
        permissionClaims:
          # Every infrastructure template's instances are one flattened
          # resource (product selected by spec.template), so one claim covers
          # the runtime app, workers, and the per-project searxng backend.
          - resource: instances
            group: infrastructure.faros.sh
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
          - resource: repositories
            group: code.faros.sh
            verbs: [get, list, watch, create, update, patch]
            tenantScoped: true
          - resource: serviceaccounts
            verbs: [get, list, watch, create, delete]
            tenantScoped: true
          - resource: secrets
            verbs: [get, list, watch, create, update, delete]
            tenantScoped: true
          - resource: clusterroles
            group: rbac.authorization.k8s.io
            verbs: [get, list, watch, create, update, delete]
            tenantScoped: true
          - resource: clusterrolebindings
            group: rbac.authorization.k8s.io
            verbs: [get, list, watch, create, update, delete]
            tenantScoped: true
      # Lets an organization run this provider in its own cluster
      # (docs/byo-providers.md). Keep manifest.yaml and
      # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
      # one that reaches production.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/faroshq/charts"
          name: "faros-vibe-studio-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "faros-provider-vibe-studio"
        releaseName: "vibe-studio"
        docsURL: "https://github.com/faroshq/faros/blob/main/providers/vibe-studio/deploy/chart/README.md"
        # The chart carries its own values reference, so the portal can show it
        # offline and for the version actually installed.
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
        requiredValues:
          - name: apiExport.infraIdentityHash
            identityFor: "infrastructure.providers.faros.sh"
            description: >-
              Identity hash of the Application Templates APIExport, needed to lifecycle instances.
          - name: apiExport.codeIdentityHash
            identityFor: "code.providers.faros.sh"
            description: >-
              Identity hash of the code APIExport, needed for repository access.
{{- end }}
