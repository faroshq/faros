# APIResourceSchema for the vibe-studio Session CRD — the control-plane
# projection of one conversation. Kept in lockstep with
# apis/vibe/v1alpha1/types_session.go; bump the vYYMMDD-NNN prefix on change.
apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260801-002.sessions.vibe.kedge.faros.sh
spec:
  group: vibe.kedge.faros.sh
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    singular: session
    shortNames:
      - vsess
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Project
          type: string
          jsonPath: .spec.projectRef.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        type: object
        properties:
          apiVersion: { type: string }
          kind: { type: string }
          metadata: { type: object }
          spec:
            type: object
            properties:
              intent:
                type: string
                maxLength: 4096
              projectRef:
                type: object
                required: [name]
                properties:
                  name: { type: string, minLength: 1, maxLength: 253 }
              modelRef:
                type: object
                required: [name]
                properties:
                  name: { type: string, minLength: 1, maxLength: 253 }
          status:
            type: object
            properties:
              phase: { type: string }
              activeTurnID: { type: string }
              lastOrdinal: { type: integer, format: int64 }
              updatedAt: { type: string, format: date-time }
              checkpoints:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    state: { type: string }
                    reason: { type: string }
