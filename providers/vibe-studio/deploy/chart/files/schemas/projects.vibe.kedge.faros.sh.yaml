# APIResourceSchema for the vibe-studio Project CRD, applied by the provider's
# `init` subcommand (sdkinstall.Bootstrap). Kept in lockstep with
# apis/vibe/v1alpha1/types_project.go — bump the vYYMMDD-NNN prefix on any
# schema change (APIResourceSchemas are immutable in kcp).
apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260801-004.projects.vibe.kedge.faros.sh
spec:
  group: vibe.kedge.faros.sh
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
    shortNames:
      - vproj
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: DisplayName
          type: string
          jsonPath: .spec.displayName
        - name: Template
          type: string
          jsonPath: .spec.template.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        type: object
        properties:
          apiVersion: { type: string }
          kind: { type: string }
          metadata: { type: object }
          spec:
            type: object
            required: [displayName]
            properties:
              displayName:
                type: string
                minLength: 1
                maxLength: 128
              description:
                type: string
                maxLength: 2048
              repository:
                type: object
                required: [repositoryRef]
                properties:
                  repositoryRef: { type: string, minLength: 1, maxLength: 253 }
                  name: { type: string, maxLength: 253 }
                  connectionRef: { type: string, maxLength: 253 }
              template:
                type: object
                required: [name]
                properties:
                  name: { type: string, minLength: 1, maxLength: 253 }
              # Copied from the Template at approval so the Session reconciler
              # provisions without reading Templates. Unknown fields are
              # PRUNED by kcp, so anything the controller needs must be here.
              development:
                type: object
                properties:
                  components:
                    type: array
                    items:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string, minLength: 1, maxLength: 63 }
                        path: { type: string, maxLength: 256 }
                        imageInput: { type: string, maxLength: 253 }
                  scaffold:
                    type: object
                    properties:
                      repository: { type: string, maxLength: 512 }
                      ref: { type: string, maxLength: 253 }
              environments:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 63 }
                    mode:
                      type: string
                      enum: [artifact, live]
                    promotion:
                      type: string
                      enum: [manual, auto]
                    revision: { type: string, maxLength: 64 }
                    bindings:
                      type: array
                      items:
                        type: object
                        required: [name, provider, kind]
                        properties:
                          name: { type: string, minLength: 1, maxLength: 63 }
                          provider: { type: string, minLength: 1, maxLength: 63 }
                          kind:
                            type: string
                            enum: [providerResource]
                          resourceRef:
                            type: object
                            properties:
                              name: { type: string }
                              apiVersion: { type: string }
                              kind: { type: string }
                              resource: { type: string }
                          values:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              phase: { type: string }
              updatedAt: { type: string, format: date-time }
              repository:
                type: object
                properties:
                  phase: { type: string }
                  url: { type: string }
              environments:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    mode: { type: string }
                    phase: { type: string }
                    revision: { type: string }
                    bindings:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          provider: { type: string }
                          phase: { type: string }
                          url: { type: string }
                          outputs:
                            type: object
                            additionalProperties: { type: string }
