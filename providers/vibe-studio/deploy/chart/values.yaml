## faros-vibe-studio-provider values
## Phase 0: stateless HTTP server + optional Postgres event store. No kcp or
## runtime kubeconfig at serve time; the init container bootstraps the
## provider workspace (schemas/APIExport/slice/bind grant).

# Container image. Build with: docker build -t IMAGE providers/vibe-studio/
image:
  repository: ghcr.io/faroshq/faros-vibe-studio-provider
  tag: ""  # empty → defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Multi-replica safe: session appends are ordinal-CAS'd in the store, so
# racing replicas conflict instead of interleaving. With the in-memory store
# (no database.dsnSecretRef) run a single replica — state is per-process.
replicaCount: 2

service:
  type: ClusterIP
  port: 8081

# Postgres DSN for the durable event store. Empty name → in-memory store
# (dev only; state does not survive restarts).
database:
  dsnSecretRef:
    name: ""
    key: dsn

# Hub the provider POSTs heartbeats to. Empty url → heartbeats disabled.
hub:
  url: https://faros-hub.faros.svc.cluster.local:9443
  tokenSecretRef:
    name: ""
    key: token
  insecure: false

# Secret holding the workspace-admin kubeconfig minted by the platform admin.
# The init container uses it to apply schemas/APIExport/slice/bind grant.
providerKubeconfig:
  secretName: faros-provider-kubeconfig

# Render the CatalogEntry into a ConfigMap the init container self-registers
# into the provider workspace. Set false to manage it via GitOps separately.
catalogEntry:
  enabled: true

apiExport:
  # REQUIRED for instance lifecycling: identityHash of the infrastructure
  # provider's APIExport (infrastructure.providers.faros.sh), read from
  # its status.identityHash in root:faros:providers:infrastructure. kcp
  # rejects first-party permission claims without it — with an empty value
  # the Project reconciler cannot create instances in tenant workspaces.
  infraIdentityHash: ""
  # Same, for the code provider's APIExport (code.providers.faros.sh):
  # backs the repositories claim the git-seeding reconciler needs.
  codeIdentityHash: ""

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
