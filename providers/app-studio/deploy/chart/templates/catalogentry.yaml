{{- define "appstudio.catalogEntry" -}}
apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: app-studio
  annotations:
    providers.faros.sh/builtin: "false"
spec:
  displayName: "App Studio"
  description: "Persistent AI project workspace for planning, memory, and chat."
  vendor: "faros"
  version: {{ .Chart.AppVersion | quote }}
  category: "AI"
  iconURL: "/ui/providers/app-studio/icon.svg"
  dependencies:
    - name: code
    - name: infrastructure
  ui:
    url: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "appstudio.fullname" .) .Release.Namespace .Values.service.port) .Values.catalogEntry.uiURL | quote }}
    indexPath: "/"
  backend:
    # The hub backend proxy forwards /services/providers/app-studio/* here,
    # injecting the verified X-Faros-Tenant/X-Faros-User headers and the
    # caller's bearer token. The provider serves /api/projects/*, /healthz
    # (liveness), and /readyz (controller-aware readiness).
    url: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "appstudio.fullname" .) .Release.Namespace .Values.service.port) .Values.catalogEntry.backendURL | quote }}
    healthPath: "/readyz"
  # Reference-only: the APIExport, schemas, slice, and bind grant are created by
  # this chart's init container (provider `init`, via the faros-provider-sdk).
  apiExport:
    name: "ai.faros.sh"
    # Keep in sync with init_cmd.go (APIExport claims) and manifest.yaml —
    # the hub writes these into the tenant APIBinding at Enable time; a claim
    # missing here is silently denied at reconcile.
    permissionClaims:
      # Built-in types ONLY — deliberately no first-party (*.faros.sh)
      # claims: those pin one APIExport identityHash for every consumer at
      # once and break mixed platform/self-hosted dependency deployments.
      # Instance and repository lifecycling acts as per-project/per-studio
      # ServiceAccounts through each workspace's own bindings (tenantaccess
      # package).
      - resource: serviceaccounts
        verbs: ["get", "list", "watch", "create", "delete"]
        tenantScoped: true
      - resource: secrets
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
      - resource: clusterroles
        group: rbac.authorization.k8s.io
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
      - resource: clusterrolebindings
        group: rbac.authorization.k8s.io
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
{{- end -}}

{{- if .Values.catalogEntry.enabled -}}
{{- if .Values.catalogEntry.renderAsConfigMap }}
# CatalogEntry registers this provider with the faros hub for routing + the
# portal Enable flow. It is a kcp resource (providers.faros.sh/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (FAROS_CATALOGENTRY_FILE -> sdkinstall.Bootstrap). The hub watches
# CatalogEntries in every workspace bound to providers.faros.sh, including
# the provider's own, so a self-registered entry is seen.
#
# It only REFERENCES the APIExport (apiExport.name); the APIExport, its
# APIResourceSchemas, the APIExportEndpointSlice, and the bind grant are created
# by the same init container. The hub no longer provisions anything from this
# CatalogEntry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appstudio.fullname" . }}-catalogentry
  labels:
    {{- include "appstudio.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
{{ include "appstudio.catalogEntry" . | indent 4 }}
{{- end }}
      # Lets an organization run this provider in its own cluster
      # (docs/byo-providers.md). Keep manifest.yaml and
      # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
      # one that reaches production.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/faroshq/charts"
          name: "faros-app-studio-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "faros-provider-app-studio"
        releaseName: "app-studio"
        docsURL: "https://github.com/faroshq/faros/blob/main/providers/app-studio/deploy/chart/README.md"
        # The chart carries its own values reference, so the portal can show it
        # offline and for the version actually installed.
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
        requiredValues:
          - name: assistant.runSandbox.mode
            value: "on"
            description: >-
              Enables universal sandboxes when this self-hosted App Studio and
              the workspace's platform or same-organization Infrastructure
              binding are both valid; the exact Infrastructure export remains
              fenced.
{{- end }}
