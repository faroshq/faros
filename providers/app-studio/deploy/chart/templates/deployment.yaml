{{- $catalogEntryConfigMap := and .Values.catalogEntry.enabled .Values.catalogEntry.renderAsConfigMap -}}
{{- $actionsCABundleConfigMap := .Values.hub.actionsCABundleConfigMap.name -}}
{{- if and (ne (int .Values.replicaCount) 1) (not .Values.workspace.emptyDir) (not .Values.workspace.existingClaim) -}}
{{- fail "app-studio replicaCount > 1 requires workspace.emptyDir=true: a single ReadWriteOnce PVC cannot back multiple replicas (workspaces are rebuilt from git on adoption)" -}}
{{- end -}}
{{- if and (eq (default "off" .Values.assistant.runSandbox.mode) "force") (ne (int .Values.replicaCount) 1) -}}
{{- fail "assistant.runSandbox.mode=force requires replicaCount=1 until coding sandbox claims have distributed CAS" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appstudio.fullname" . }}
  labels:
    {{- include "appstudio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Replica awareness (durable run claims + project affinity with git
  # re-hydration on adoption) lets replicas coexist; rolling updates keep
  # capacity and only move the replaced pod's projects.
  strategy:
    {{- if .Values.workspace.emptyDir }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # A single RWO workspace volume can only be mounted by one pod: replace,
    # never overlap.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "appstudio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appstudio.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "appstudio.serviceAccountName" . }}
      # The provider uses the explicitly mounted workspace-admin kubeconfig; it
      # should not receive an ambient Kubernetes ServiceAccount token.
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Bootstrap the provider workspace (schemas, APIExport, slice, bind
        # grant) with the onboarded workspace-admin kubeconfig. Schemas baked at
        # /etc/faros/schemas (Dockerfile). Idempotent.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            - name: FAROS_SCHEMAS_DIR
              value: /etc/faros/schemas
            {{- if $catalogEntryConfigMap }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it to
            # the hosting cluster. It is rendered into a ConfigMap (mounted below)
            # and init self-registers it into the provider workspace via the
            # provider kubeconfig.
            - name: FAROS_CATALOGENTRY_FILE
              value: /etc/faros/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: faros-provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
            {{- if $catalogEntryConfigMap }}
            - name: catalogentry
              mountPath: /etc/faros/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            # Peer-forwarded project requests (replica affinity). Reached by
            # pod IP from peer replicas; deliberately NOT on the Service.
            - name: internal
              containerPort: {{ .Values.internalPort }}
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: "8081"
            # Replica identity + forwarding address for durable run claims and
            # project affinity (docs/app-studio-replica-awareness.md).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: APP_STUDIO_INTERNAL_PORT
              value: {{ .Values.internalPort | quote }}
            - name: FAROS_HUB_URL
              value: {{ .Values.hub.url | quote }}
            {{- if .Values.hub.actionsExternalURL }}
            - name: FAROS_ACTIONS_EXTERNAL_URL
              value: {{ .Values.hub.actionsExternalURL | quote }}
            {{- end }}
            {{- if $actionsCABundleConfigMap }}
            - name: FAROS_ACTIONS_CA_BUNDLE_FILE
              value: /etc/faros/actions-ca/ca-bundle.pem
            {{- end }}
            - name: FAROS_PROVIDER_NAME
              value: "app-studio"
            # Production deployments require the multicluster controller. The
            # provider remains live while it retries, but /readyz stays 503
            # until the manager is running and returns to 503 if it exits.
            - name: APP_STUDIO_CONTROLLER_MODE
              value: "required"
            # Provider kubeconfig — used for the kcp front-proxy host + TLS
            # only; the tenant client drops its credential and acts as the
            # calling user via the forwarded bearer token.
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            - name: APP_STUDIO_WORKSPACE_ROOT
              value: {{ .Values.workspace.path | quote }}
            {{- if .Values.store.databaseURL }}
            - name: APP_STUDIO_DATABASE_URL
              value: {{ .Values.store.databaseURL | quote }}
            {{- else if .Values.store.databaseURLSecretRef.name }}
            - name: APP_STUDIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.databaseURLSecretRef.name }}
                  key: {{ .Values.store.databaseURLSecretRef.key }}
            {{- end }}
            {{- if .Values.store.inMemoryMessageStore }}
            - name: APP_STUDIO_IN_MEMORY_MESSAGE_STORE
              value: "true"
            {{- end }}
            {{- with .Values.assistant.toolDisclosure }}
            # "minimal" hides action targets and outcomes from the chat.
            # Default "summary" shows product-level action details only;
            # raw tool envelopes/arguments remain hidden, while bounded,
            # sanitized command stdout/stderr is available on explicit expand.
            - name: APP_STUDIO_TOOL_DISCLOSURE
              value: {{ . | quote }}
            {{- end }}
            {{- /* A non-null deprecated boolean must reach the process without
                  the chart's default mode=off masking migration semantics.
                  Non-off explicit modes remain authoritative. */}}
            {{- if not (and (ne .Values.assistant.runSandbox.enabled nil) (eq (default "off" .Values.assistant.runSandbox.mode) "off")) }}
            {{- with .Values.assistant.runSandbox.mode }}
            - name: APP_STUDIO_RUN_SANDBOX_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: APP_STUDIO_DEVELOPMENT_MODE
              value: {{ .Values.assistant.runSandbox.developmentMode | quote }}
            - name: APP_STUDIO_REPLICA_COUNT
              value: {{ .Values.replicaCount | quote }}
            {{- if ne .Values.assistant.runSandbox.enabled nil }}
            - name: APP_STUDIO_RUN_SANDBOX
              value: {{ .Values.assistant.runSandbox.enabled | quote }}
            {{- end }}
            - name: APP_STUDIO_PREVIEW_CONSOLE_ENABLED
              value: {{ .Values.previewConsole.enabled | quote }}
            {{- if and .Values.previewConsole.enabled (or .Values.previewConsole.signingKeyID .Values.previewConsole.signingKeySecretRef.name) }}
            - name: APP_STUDIO_PREVIEW_CONSOLE_SIGNING_KEY_ID
              value: {{ required "previewConsole.signingKeyID is required when previewConsole.enabled=true" .Values.previewConsole.signingKeyID | quote }}
            - name: APP_STUDIO_PREVIEW_CONSOLE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "previewConsole.signingKeySecretRef.name is required when previewConsole.enabled=true" .Values.previewConsole.signingKeySecretRef.name }}
                  key: {{ .Values.previewConsole.signingKeySecretRef.key | default "private-key.pem" }}
            {{- end }}
            {{- if .Values.store.messageRetention }}
            - name: APP_STUDIO_MESSAGE_RETENTION
              value: {{ .Values.store.messageRetention | quote }}
            {{- end }}
            {{- if .Values.store.attachmentDraftRetention }}
            - name: APP_STUDIO_ATTACHMENT_DRAFT_RETENTION
              value: {{ .Values.store.attachmentDraftRetention | quote }}
            {{- end }}
            {{- if ne (toString .Values.store.attachmentWorkspaceQuotaBytes) "" }}
            - name: APP_STUDIO_ATTACHMENT_WORKSPACE_QUOTA_BYTES
              value: {{ .Values.store.attachmentWorkspaceQuotaBytes | quote }}
            {{- end }}
            {{- if .Values.store.messageEncryptionKeysSecretRef.name }}
            - name: APP_STUDIO_MESSAGE_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.messageEncryptionKeysSecretRef.name }}
                  key: {{ .Values.store.messageEncryptionKeysSecretRef.key }}
            {{- end }}
            {{- if .Values.hub.insecure }}
            - name: FAROS_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: FAROS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
          volumeMounts:
            # The onboarded workspace-admin kubeconfig; the SA token inside is
            # what the tenant client presents to reach tenant workspaces.
            - name: faros-provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
            - name: project-workspaces
              mountPath: {{ .Values.workspace.path | quote }}
            {{- if $actionsCABundleConfigMap }}
            - name: actions-ca-bundle
              mountPath: /etc/faros/actions-ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Required input: the workspace-admin kubeconfig minted via /bonkers
        # (admin onboarding), consumed by both init and serve. The onboard
        # response stores it under key "kubeconfig"; map it to the file path the
        # provider reads.
        - name: faros-provider-kubeconfig
          secret:
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: faros-provider-kubeconfig
        {{- if $catalogEntryConfigMap }}
        - name: catalogentry
          configMap:
            name: {{ include "appstudio.fullname" . }}-catalogentry
        {{- end }}
        - name: project-workspaces
          {{- if .Values.workspace.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.existingClaim | quote }}
          {{- else if or .Values.workspace.emptyDir (not .Values.workspace.persistence.enabled) }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "appstudio.fullname" . }}-workspaces
          {{- end }}
        {{- if $actionsCABundleConfigMap }}
        - name: actions-ca-bundle
          configMap:
            name: {{ $actionsCABundleConfigMap | quote }}
            items:
              - key: {{ .Values.hub.actionsCABundleConfigMap.key | quote }}
                path: ca-bundle.pem
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
