nameOverride: ""
fullnameOverride: ""

# App Studio assistant project mutations use a single active writer. The chart
# rejects other values and uses a Recreate deployment strategy to prevent
# cross-pod overlap during upgrades.
replicaCount: 1

image:
  repository: ghcr.io/faroshq/faros/app-studio-provider
  tag: ""
  pullPolicy: IfNotPresent

# Preview inspection no longer runs a browser sidecar here. The assistant drives
# the workspace's shared headless browser — the infrastructure provider's
# Playwright MCP "browser" template, provisioned once per workspace by the Studio
# reconciler — over the infrastructure data plane. Nothing to configure.

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8081

# When true, the chart renders the CatalogEntry (which registers the provider
# with the hub) into a ConfigMap that the init container applies into the
# provider workspace via the provider kubeconfig. The CatalogEntry is a kcp
# resource, so it is NOT applied to the hosting cluster this chart installs into.
# Set to false to manage the CatalogEntry separately (e.g. GitOps with a
# different rollout cadence).
catalogEntry:
  enabled: true
  renderAsConfigMap: true
  uiURL: ""
  backendURL: ""

apiExport:
  # REQUIRED for instance lifecycling: identityHash of the infrastructure
  # provider's APIExport (infrastructure.providers.faros.sh), read from
  # its status.identityHash in root:faros:providers:infrastructure (or copy it
  # from /bonkers root-identities). kcp rejects first-party permission claims
  # without it — with an empty value the Project reconciler cannot create
  # instances in tenant workspaces.
  infraIdentityHash: ""
  # REQUIRED: identityHash of the code provider's APIExport
  # (code.providers.faros.sh). New projects require Repository and
  # ChangeRequest authority; chart rendering fails while
  # this is empty rather than booting a partially functional GitOps flow.
  codeIdentityHash: ""
  # REQUIRED: identityHash of the deployments provider's APIExport
  # (deployments.faros.sh). New projects require RepositorySync, Release, and
  # Deployment authority; chart rendering fails while empty so App Studio
  # cannot bootstrap unauthorizable deployment claims.
  deploymentsIdentityHash: ""

# Secret holding the workspace-admin kubeconfig minted by the platform admin
# via /bonkers (admin onboarding). Consumed by both the init container and the
# serve container. Key must be "kubeconfig".
providerKubeconfig:
  secretName: faros-provider-kubeconfig

# Assistant chat behavior.
assistant:
  # How much tool-level detail the chat disclosures show.
  #   "" / "summary" (default) — tool names + per-tool sanitized summaries
  #     (paths, queries, counts — never raw file contents or secrets).
  #   "minimal" — fully opaque generic labels only ("Edited files"), for
  #     deployments whose users should not see implementation detail.
  toolDisclosure: ""

# Browser-console sharing starts automatically while the embedded preview is
# open. Until both signing fields are configured, App Studio stays available
# but reports console instrumentation as unavailable.
# The private key signs short-lived iframe capabilities. Its matching current
# and previous public JWKs are deployed independently with the preview bridge.
previewConsole:
  enabled: true
  signingKeyID: ""
  signingKeySecretRef:
    name: ""
    key: private-key.pem

# App Studio no longer holds a kubeconfig to the runtime cluster. The
# development data plane (sync, logs, restart, preview readiness) is served by
# the infrastructure provider as subresources on the project's template
# instance, reached through the hub as the calling user.
# See docs/app-studio-runtime-decoupling.md.

# Development runtime images are NOT configured here — the infrastructure
# provider owns them (its chart's development.images / FAROS_DEV_IMAGE_*).
# App Studio passes only the project reference. See
# providers/infrastructure/docs/template-conventions.md.

# App Studio chat-message persistence. Prefer databaseURLSecretRef in
# production; inMemoryMessageStore is an explicit non-durable fallback only.
store:
  databaseURL: ""
  databaseURLSecretRef:
    name: ""
    key: database-url
  inMemoryMessageStore: false
  # Retention window understood by Go's time.ParseDuration, e.g. "720h".
  messageRetention: ""
  messageEncryptionKeysSecretRef:
    name: ""
    key: keys

# App Studio project workspaces. The provider stores checked-out/generated
# project files here so the agent can list, read, search, and later mutate them.
workspace:
  path: /var/lib/faros-app-studio/workspaces
  existingClaim: ""
  emptyDir: false
  persistence:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""

hub:
  url: "http://faros-hub.faros.svc.cluster.local:8080"
  # Public hub origin used by action-enabled development runtimes. Keep this
  # separate from hub.url: the latter is an internal provider-to-hub address.
  # Production action-enabled projects require an absolute HTTPS origin.
  actionsExternalURL: ""
  # Optional public CA bundle for that origin. The referenced ConfigMap is
  # mounted at a dedicated path so it augments (never masks) image/system
  # trust. Leave empty when the origin chains to the system CA.
  actionsCABundleConfigMap:
    name: ""
    key: ca-bundle.pem
  insecure: false
  tokenSecretRef:
    name: ""
    key: token

podLabels: {}
podAnnotations: {}
podSecurityContext:
  fsGroup: 65532
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
