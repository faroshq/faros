apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260901-9ac5b75d.projects.ai.faros.sh
spec:
  group: ai.faros.sh
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    shortNames:
    - proj
    singular: project
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: DisplayName
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.updatedAt
      name: Updated
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      description: Project is a persistent AI workspace scoped to a Faros child workspace.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: ProjectSpec defines user-authored Project state.
          properties:
            components:
              description: |-
                Components are the stable source and build units that make up this
                Project. A component can be mapped to a different provider Template in
                each environment without changing its source identity.
              items:
                description: |-
                  ProjectComponentSpec is the Project-owned logical identity of one source
                  and build unit. Providers consume this contract through environment binding
                  mappings; they do not own the source paths.
                properties:
                  build:
                    description: Build describes the source context used to produce
                      an immutable image.
                    properties:
                      contextPath:
                        description: ContextPath is relative to the repository root.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      dockerfilePath:
                        description: DockerfilePath is relative to the repository
                          root.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    required:
                    - contextPath
                    - dockerfilePath
                    type: object
                  kind:
                    description: Kind determines whether this component is expected
                      to serve traffic.
                    enum:
                    - Service
                    - Worker
                    type: string
                  name:
                    description: Name is a stable component identifier such as web,
                      api, or worker.
                    maxLength: 63
                    minLength: 1
                    type: string
                  ports:
                    description: |-
                      Ports describes the production network contract for this component.
                      Development listener ports are configured independently by the
                      DevelopmentService resource.
                    items:
                      description: ProjectComponentPortSpec declares a named production
                        port.
                      properties:
                        containerPort:
                          description: ContainerPort is the port exposed by the component
                            workload.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        name:
                          description: |-
                            Name is the stable port name used by Template component mappings and
                            application routes.
                          maxLength: 63
                          minLength: 1
                          type: string
                        protocol:
                          description: Protocol is the protocol spoken by the port.
                          enum:
                          - HTTP
                          - HTTPS
                          - TCP
                          type: string
                      required:
                      - containerPort
                      - name
                      - protocol
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  sourcePath:
                    description: SourcePath is the component's directory relative
                      to the repository root.
                    maxLength: 1024
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                - sourcePath
                type: object
              maxItems: 64
              type: array
              x-kubernetes-list-map-keys:
              - name
              x-kubernetes-list-type: map
            description:
              description: Description is a short project summary.
              maxLength: 2048
              type: string
            displayName:
              description: DisplayName is the human-readable project title.
              maxLength: 128
              minLength: 1
              type: string
            environments:
              description: |-
                Environments describe provider-backed runtime capabilities for this
                Project. App Studio owns the binding contract; providers own runtime
                implementation details.
              items:
                properties:
                  autoDeploy:
                    description: AutoDeploy marks artifact environments that should
                      deploy automatically.
                    type: boolean
                  bindings:
                    description: Bindings connect this environment to provider capabilities.
                    items:
                      properties:
                        allowedActions:
                          description: |-
                            AllowedActions is the versioned allow-list for non-owning provider
                            references. Owning providerResource bindings may leave this empty; the
                            integration gateway requires an explicitly declared action before it
                            forwards a call.
                          items:
                            description: |-
                              ProjectProviderActionSpec declares one versioned provider action that a
                              generated application may invoke through the App Studio integration
                              gateway. The gateway treats the declaration as an allow-list: an omitted
                              action, an unknown version, or a revoked declaration is rejected before any
                              provider tool is called.
                            properties:
                              grantedAt:
                                description: |-
                                  GrantedAt is the server time at which the catalog-backed grant was
                                  verified. Clients cannot set or replace this audit value.
                                format: date-time
                                type: string
                              grantedBy:
                                description: |-
                                  GrantedBy is the authenticated caller recorded by the server when the
                                  action grant is verified against the provider catalog. Clients cannot
                                  set or replace this audit value.
                                type: string
                              name:
                                description: Name is the provider-neutral action name
                                  (for example query_table).
                                maxLength: 63
                                minLength: 1
                                type: string
                              revoked:
                                description: |-
                                  Revoked disables this action without removing the integration binding,
                                  allowing an operator to retain the audit history while closing access.
                                type: boolean
                              revokedAt:
                                description: |-
                                  RevokedAt is the server time at which the active action grant was
                                  revoked. Clients cannot set or replace this audit value.
                                format: date-time
                                type: string
                              revokedBy:
                                description: |-
                                  RevokedBy is the authenticated caller recorded by the server when an
                                  active action grant is revoked. Clients cannot set or replace this audit
                                  value.
                                type: string
                              schemaDigest:
                                description: |-
                                  SchemaDigest identifies the exact provider action schema that the caller
                                  reviewed and consented to. Digests are immutable action-catalog content
                                  addresses; digest-less grants are never accepted.
                                maxLength: 71
                                minLength: 71
                                pattern: ^sha256:[a-f0-9]{64}$
                                type: string
                              version:
                                description: Version identifies the versioned action
                                  contract (for example v1).
                                maxLength: 32
                                minLength: 1
                                type: string
                            required:
                            - name
                            - schemaDigest
                            - version
                            type: object
                          type: array
                        componentMappings:
                          description: |-
                            ComponentMappings map Project-owned source components to components in
                            the selected Template. They are primarily used by artifact/production
                            bindings and are ignored by provider references.
                          items:
                            description: |-
                              ProjectComponentMappingSpec maps a Project component to a named component
                              in the selected provider Template.
                            properties:
                              componentRef:
                                description: ComponentRef names the Project component.
                                maxLength: 63
                                minLength: 1
                                type: string
                              targetComponent:
                                description: TargetComponent names the component in
                                  the selected Template.
                                maxLength: 63
                                minLength: 1
                                type: string
                            required:
                            - componentRef
                            - targetComponent
                            type: object
                          maxItems: 64
                          type: array
                          x-kubernetes-list-map-keys:
                          - targetComponent
                          x-kubernetes-list-type: map
                        kind:
                          enum:
                          - providerResource
                          - providerReference
                          type: string
                        lifecycle:
                          description: Lifecycle controls deletion behavior for the
                            bound provider resource.
                          properties:
                            deletionPolicy:
                              description: |-
                                DeletionPolicy defaults to Delete when omitted. Stateful providers can be
                                retained explicitly by setting Retain.
                              enum:
                              - Delete
                              - Retain
                              type: string
                          type: object
                        name:
                          maxLength: 63
                          minLength: 1
                          type: string
                        provider:
                          maxLength: 63
                          minLength: 1
                          type: string
                        resourceRef:
                          properties:
                            apiVersion:
                              type: string
                            kind:
                              type: string
                            name:
                              type: string
                            resource:
                              type: string
                          type: object
                        templateRef:
                          description: |-
                            TemplateRef selects the provider Template for this binding. It is the
                            canonical source for managed provider resources. Project.spec.template
                            remains a legacy/simple-flow fallback for bindings that omit this field.
                          properties:
                            name:
                              description: Name is the Template's catalog name (e.g.
                                "application").
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        values:
                          description: |-
                            Values is provider-owned configuration. App Studio treats it as an
                            opaque contract payload.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - kind
                      - name
                      - provider
                      type: object
                    type: array
                  mode:
                    description: |-
                      Mode distinguishes artifact-based environments from live development
                      runtimes. Empty means artifact for backward compatibility.
                    type: string
                  name:
                    description: Name is a stable environment identifier such as development
                      or test.
                    maxLength: 63
                    minLength: 1
                    type: string
                  preview:
                    description: |-
                      Preview selects the primary DevelopmentService URL shown by App Studio
                      for this environment. Other services remain addressable individually.
                    properties:
                      primaryServiceRef:
                        description: |-
                          PrimaryServiceRef is the name of a DevelopmentService in this Project
                          environment.
                        maxLength: 63
                        type: string
                    type: object
                  promotion:
                    description: Promotion controls how changes move into this environment.
                    type: string
                required:
                - name
                type: object
              type: array
            memory:
              description: |-
                Memory stores durable context the AI should consider for this
                project. It is edited explicitly through the API in the MVP.
              properties:
                constraints:
                  items:
                    type: string
                  type: array
                goals:
                  items:
                    type: string
                  type: array
                requirements:
                  items:
                    type: string
                  type: array
              type: object
            repository:
              description: Repository records the Code provider repository backing
                this Project.
              properties:
                adopted:
                  description: |-
                    Adopted marks a binding built from an EXISTING Repository CR
                    (repository import). The Project reconciler creates the Repository CR
                    for non-adopted bindings only — an adopted repository is never
                    (re)created on the project's behalf.
                  type: boolean
                connectionRef:
                  description: ConnectionRef names the Code provider Connection used
                    by the Repository.
                  maxLength: 253
                  type: string
                name:
                  description: Name is the repository name on the git host.
                  maxLength: 253
                  type: string
                repositoryRef:
                  description: RepositoryRef names the Repository resource in the
                    same workspace.
                  maxLength: 253
                  minLength: 1
                  type: string
              required:
              - repositoryRef
              type: object
            sharing:
              description: |-
                Sharing captures App Studio access policy intent for previews and
                published apps. Empty policies are interpreted as private.
              properties:
                preview:
                  description: |-
                    Preview controls who may access the mutable development preview. Private
                    requires platform sign-in and workspace access; public allows anyone with
                    the URL. The legacy shared value is normalized to private by App Studio.
                  properties:
                    mode:
                      description: Mode is the requested preview visibility. Empty
                        means private.
                      enum:
                      - private
                      - public
                      type: string
                  type: object
                publishing:
                  description: |-
                    Publishing controls who may access published app instances once the
                    publishing runtime exists.
                  properties:
                    mode:
                      description: Mode is the requested visibility for this channel.
                        Empty means private.
                      enum:
                      - private
                      - shared
                      - public
                      type: string
                  type: object
              type: object
            template:
              description: |-
                Template names the infrastructure Template whose instance backs this
                Project's development environment (docs/app-studio-template-sandboxes.md).
                When set, the development binding is generated from the Template's
                instanceCRD with farosMode: development, and file sync routes per the
                Template's declared development components. Empty means the project has
                no development environment yet — one must be selected before any
                development runtime surface (sync, preview, logs) works.
              properties:
                name:
                  description: Name is the Template's catalog name (e.g. "application").
                  maxLength: 253
                  minLength: 1
                  type: string
              required:
              - name
              type: object
          required:
          - displayName
          type: object
        status:
          description: ProjectStatus defines the observed Project state.
          properties:
            bindingInventory:
              description: |-
                BindingInventory records the last provider-resource identities owned by
                this Project. The controller uses it to clean up a binding removed from
                spec, when the removed binding's dynamic resource kind is no longer
                available in the current Project spec.
              items:
                description: |-
                  ProjectBindingInventoryStatus preserves enough information to lifecycle a
                  provider resource after its binding has been removed from spec. It is
                  controller-maintained status, not user-authored desired state.
                properties:
                  binding:
                    description: Binding identifies the removed binding.
                    type: string
                  deletionPolicy:
                    description: DeletionPolicy is the policy captured when the binding
                      was last observed.
                    type: string
                  environment:
                    description: |-
                      Environment identifies the environment that previously contained the
                      binding.
                    type: string
                  provider:
                    description: Provider identifies the provider that owns the resource.
                    type: string
                  resourceRef:
                    description: |-
                      ResourceRef is the complete dynamic resource identity required to address
                      the provider resource after the binding is removed.
                    properties:
                      apiVersion:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      resource:
                        type: string
                    type: object
                type: object
              maxItems: 128
              type: array
            environments:
              description: Environments reports provider-observed environment state.
              items:
                properties:
                  bindings:
                    items:
                      properties:
                        name:
                          type: string
                        outputs:
                          additionalProperties:
                            type: string
                          type: object
                        phase:
                          type: string
                        previewURL:
                          type: string
                        provider:
                          type: string
                        url:
                          type: string
                      type: object
                    type: array
                  mode:
                    type: string
                  name:
                    type: string
                  phase:
                    type: string
                type: object
              type: array
            phase:
              description: Phase is Ready for MVP-created Projects.
              type: string
            updatedAt:
              description: UpdatedAt reflects the latest API mutation affecting metadata
                or memory.
              format: date-time
              type: string
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
