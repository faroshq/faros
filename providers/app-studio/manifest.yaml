# App Studio provider — register with the faros hub.
#
# App Studio gives tenants a persistent AI project workspace: project metadata,
# durable "memory" (goals/requirements/constraints), and a chat surface backed
# by the tenant's own LLM credentials, with optional MCP tool use against the
# workspace.
#
# Apply this against the kcp workspace where the faros.sh APIExport is
# bound (typically root:faros:providers when running embedded kcp for
# development):
#
#   kubectl --kubeconfig kcp-admin.kubeconfig apply -f manifest.yaml
#
# For local dev the provider binary runs on the host (PORT=8085, see the
# Tiltfile run-provider-app-studio target) and the hub reverse-proxies both the
# portal bundle and the /api backend to the loopback URLs below. For in-cluster
# deployment, the Helm chart renders the Service DNS instead, e.g.
#   url: http://app-studio.app-studio.svc.cluster.local:8081
#
# This CatalogEntry registers routing and references apiExport.name. The
# provider's init command creates the APIExport, schemas, endpoint slice, and
# bind grant from deploy/chart/files/schemas.
---
apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: app-studio
  annotations:
    providers.faros.sh/builtin: "false"
spec:
  displayName: "App Studio"
  description: "Persistent AI project workspace for planning, memory, and chat."
  vendor: "faros"
  version: "0.1.0"
  category: "AI"
  iconURL: "/ui/providers/app-studio/icon.svg"
  dependencies:
    - name: code
    - name: infrastructure
  ui:
    # Dev loopback port (PORT / Tiltfile run-provider-app-studio). 8085 to
    # avoid colliding with quickstart (8081) and kuery (8084).
    url: "http://localhost:8085"
    indexPath: "/"
  backend:
    # The hub backend proxy forwards /services/providers/app-studio/* here,
    # injecting the verified X-Faros-Tenant/X-Faros-User headers and the
    # caller's bearer token. The provider serves /api/projects/*, /healthz
    # (liveness), and /readyz (controller-aware readiness).
    url: "http://localhost:8085"
    healthPath: "/readyz"

  apiExport:
    name: "ai.faros.sh"
    # Static API surface the init command must publish before the hub offers
    # this provider for Enable. Runtime-added resources may extend this set.
    requiredResources:
      - group: ai.faros.sh
        name: projects
      - group: ai.faros.sh
        name: sessions
      - group: ai.faros.sh
        name: studios
    # Keep in sync with init_cmd.go (APIExport claims) and
    # deploy/chart/templates/catalogentry.yaml — the hub writes these into the
    # tenant APIBinding at Enable time; a claim missing here is silently
    # denied at reconcile.
    permissionClaims:
      # Infrastructure instances the Project reconciler lifecycles from a
      # project's live bindings.
      - resource: applications
        group: infrastructure.faros.sh
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      - resource: simplewebapps
        group: infrastructure.faros.sh
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      - resource: workers
        group: infrastructure.faros.sh
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      # Web search: the Studio reconciler provisions one shared searxng
      # instance per workspace so the assistant can look things up.
      - resource: searxngs
        group: infrastructure.faros.sh
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      # Preview browser: the Studio reconciler provisions one shared headless
      # browser (Playwright MCP) per workspace for development-preview inspection.
      - resource: browsers
        group: infrastructure.faros.sh
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        tenantScoped: true
        identitySource: {kind: Provider, provider: infrastructure}
      # Repository CRs the Project reconciler creates (git backing).
      - resource: repositories
        group: code.faros.sh
        verbs: ["get", "list", "watch", "create", "update", "patch"]
        tenantScoped: true
        identitySource: {kind: Provider, provider: code}
      # Per-project ServiceAccount identity for reconciler commits, plus
      # per-workspace LLM credential Secrets.
      - resource: serviceaccounts
        verbs: ["get", "list", "watch", "create", "delete"]
        tenantScoped: true
      - resource: secrets
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
      - resource: clusterroles
        group: rbac.authorization.k8s.io
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
      - resource: clusterrolebindings
        group: rbac.authorization.k8s.io
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
