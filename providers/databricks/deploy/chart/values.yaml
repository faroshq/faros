image:
  repository: ghcr.io/faroshq/faros-databricks-provider
  tag: ""
  pullPolicy: IfNotPresent

# Safe to scale: serving resolves tenant clusters through the APIExport
# endpoint slice on every replica, and the controllers are leader-elected
# (one active set per Lease in the provider workspace).
replicaCount: 1

service:
  type: ClusterIP
  port: 8081

hub:
  url: https://faros-hub.faros.svc.cluster.local:9443
  # Bearer token for the heartbeat POST. Empty (the default) omits the
  # Authorization header entirely — the heartbeat endpoint does not require
  # it. Set the name ONLY when the Secret already exists in the release
  # namespace: the reference is not optional, so a missing Secret leaves the
  # pod in CreateContainerConfigError forever.
  tokenSecretRef:
    name: ""
    key: token
  insecure: false

# The multicluster controller is required for production: it validates the
# Connection -> Warehouse -> Table dependency chain and serves provider
# authority for actions. Set mode=rest-only only for an intentional local UI/API
# process; /readyz and heartbeat then describe that explicit mode.
controller:
  mode: required
  retryInterval: 15s

# Bootstrap is explicit because the provider cannot become ready without a
# provider-workspace kubeconfig. `init` runs the image's `init` subcommand in an
# init container and may apply the rendered CatalogEntry. `external` skips that
# init container and requires an operator/GitOps process to have already
# installed the APIExport, endpoint slice, schemas, and CatalogEntry.
bootstrap:
  enabled: true
  mode: init

providerKubeconfig:
  secretName: faros-provider-kubeconfig

catalogEntry:
  enabled: true

# MCP remains a compatibility/presentation surface; Provider Actions do not
# depend on it. The localhost protection bypass is a narrowly scoped local-dev
# setting and must remain false in production.
mcp:
  enabled: true
  disableLocalhostProtection: false

# Empty uses the backend's standard Databricks cloud suffix allowlist. Add
# private workspace suffixes deliberately; values are passed as a comma-
# separated DATABRICKS_ALLOWED_HOST_SUFFIXES environment variable.
allowedHostSuffixes: []

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  # Numeric UID/GID for the distroless "nonroot" user: kubelet cannot verify
  # runAsNonRoot against a non-numeric image USER and refuses to start the
  # container without these.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

nameOverride: ""
fullnameOverride: ""
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
