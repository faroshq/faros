{{- if .Values.catalogEntry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "databricks.fullname" . }}-catalogentry
  labels:
    {{- include "databricks.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.kedge.faros.sh/v1alpha1
    kind: CatalogEntry
    metadata:
      name: databricks
    spec:
      displayName: "Databricks"
      description: "Expose imported Databricks SQL Warehouse tables to kedge apps."
      vendor: "kedge"
      version: {{ .Chart.AppVersion | quote }}
      category: "Data"
      iconURL: "/ui/providers/databricks/icon.svg"
      ui:
        url: "http://{{ include "databricks.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
        children:
          - displayName: Connections
            builtinRoute: connections
          - displayName: Warehouses
            builtinRoute: warehouses
          - displayName: Tables
            builtinRoute: tables
      backend:
        url: "http://{{ include "databricks.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/healthz"
      virtualWorkspace:
        url: "http://{{ include "databricks.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
      actions:
        - id: query_table/v1
          displayName: "Query table"
          description: "Run a bounded read-only query against an imported Databricks table."
          boundResource:
            apiVersion: "databricks.kedge.faros.sh/v1alpha1"
            kind: "Table"
            resource: "tables"
          inputSchema:
            type: object
            properties:
              columns:
                type: array
                maxItems: 64
                items:
                  type: string
              limit:
                type: integer
                minimum: 1
                maximum: 100
            additionalProperties: false
          outputSchema:
            type: object
            required: [actionVersion, tableRef, columns, rows]
            properties:
              actionVersion:
                type: string
                const: v1
              tableRef:
                type: string
              columns:
                type: array
                maxItems: 64
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    type:
                      type: string
              rows:
                type: array
                maxItems: 100
                items:
                  type: object
                  additionalProperties: true
              truncated:
                type: boolean
            additionalProperties: false
          schemaDigest: "sha256:9d466354d5434778c39c74123156aba76510128b0d48c5f521836770561ab853"
          executionMode: sync
          readOnly: true
          risk: low
          idempotency: inherent
          limits:
            timeoutSeconds: 45
            maxInputBytes: 8192
            maxOutputBytes: 65536
            maxResultItems: 100
          consent:
            required: false
      apiExport:
        name: "databricks.providers.kedge.faros.sh"
        permissionClaims:
          - resource: secrets
            verbs: [get]
            tenantScoped: true
{{- end }}
