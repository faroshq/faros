{{- $bootstrapMode := include "databricks.bootstrapMode" . | trim -}}
{{- if and (ne $bootstrapMode "init") (ne $bootstrapMode "external") }}
{{- fail "bootstrap.mode must be init or external" }}
{{- end }}
{{- if not .Values.providerKubeconfig.secretName }}
{{- fail "providerKubeconfig.secretName is required: init and serve need the provider-workspace kubeconfig Secret" }}
{{- end }}
{{- if and (eq $bootstrapMode "external") .Values.catalogEntry.enabled }}
{{- fail "catalogEntry.enabled must be false when bootstrap.mode=external; install the CatalogEntry through the external bootstrap owner" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "databricks.fullname" . }}
  labels:
    {{- include "databricks.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "databricks.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "databricks.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "databricks.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $bootstrapMode "init" }}
      initContainers:
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["init"]
          env:
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            - name: FAROS_SCHEMAS_DIR
              value: /etc/faros/schemas
            {{- if .Values.catalogEntry.enabled }}
            - name: FAROS_CATALOGENTRY_FILE
              value: /etc/faros/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/faros/catalogentry
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            - name: FAROS_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: FAROS_PROVIDER_NAME
              value: databricks
            - name: FAROS_PROVIDER_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: DATABRICKS_CONTROLLER_MODE
              value: {{ .Values.controller.mode | quote }}
            - name: DATABRICKS_CONTROLLER_RETRY_INTERVAL
              value: {{ .Values.controller.retryInterval | quote }}
            - name: DATABRICKS_MCP_ENABLED
              value: {{ .Values.mcp.enabled | quote }}
            - name: DATABRICKS_MCP_DISABLE_LOCALHOST_PROTECTION
              value: {{ .Values.mcp.disableLocalhostProtection | quote }}
            {{- if .Values.allowedHostSuffixes }}
            - name: DATABRICKS_ALLOWED_HOST_SUFFIXES
              value: {{ join "," .Values.allowedHostSuffixes | quote }}
            {{- end }}
            - name: FAROS_HUB_INSECURE
              value: {{ .Values.hub.insecure | quote }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: FAROS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
      volumes:
        - name: provider-kubeconfig
          secret:
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: faros-provider-kubeconfig
        {{- if and (eq $bootstrapMode "init") .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "databricks.fullname" . }}-catalogentry
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
