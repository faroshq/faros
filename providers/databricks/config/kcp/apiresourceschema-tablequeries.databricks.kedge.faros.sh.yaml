    kind: TableQuery
    listKind: TableQueryList
    plural: tablequeries
    shortNames:
    - dbxq
    singular: tablequery
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tableRef
