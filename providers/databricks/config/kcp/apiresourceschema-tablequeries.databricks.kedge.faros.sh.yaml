    name: v1alpha1
    schema:
      description: |-
        TableQuery executes one bounded, provider-constructed SELECT against an
        imported Table. The caller supplies only the Table resource name and an
        optional projection; the controller resolves the Warehouse, Connection,
        and credential Secret from that Table.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          properties:
            actionVersion:
              description: |-
                ActionVersion is the versioned query_table contract. The provider
                currently accepts only v1.
              enum:
              - v1
              type: string
            columns:
              description: |-
                Columns is an optional projection. Every item must match a cached Table
                status column exactly; arbitrary SQL expressions are not accepted.
              items:
                type: string
              maxItems: 64
              type: array
            limit:
              description: |-
                Limit is bounded by the provider and defaults to its fixed maximum when
                omitted. It is retained on the transient resource for auditability.
              format: int32
              maximum: 100
              minimum: 1
              type: integer
            tableRef:
              description: TableRef is the name of an imported Table resource in this
                tenant.
              minLength: 1
              type: string
          required:
          - actionVersion
          - tableRef
          type: object
        status:
          properties:
            columns:
              items:
                properties:
                  name:
                    minLength: 1
                    type: string
                  type:
                    type: string
                required:
                - name
                type: object
              maxItems: 64
              type: array
            completedAt:
              format: date-time
              type: string
            error:
              description: Error is a sanitized, user-safe failure message.
              maxLength: 512
              type: string
            observedGeneration:
              format: int64
              type: integer
            phase:
              description: |-
                TableQueryPhase is the lifecycle state of a transient provider-owned query.
                TableQuery resources are created by the provider MCP adapter and should be
                deleted after their result has been read.
              enum:
              - Pending
              - Running
              - Succeeded
