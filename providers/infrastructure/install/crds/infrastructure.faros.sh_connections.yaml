---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: connections.infrastructure.faros.sh
spec:
  group: infrastructure.faros.sh
  names:
    categories:
    - faros
    kind: Connection
    listKind: ConnectionList
    plural: connections
    shortNames:
    - conn
    singular: connection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.instanceRef.name
      name: Source
      type: string
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Connection binds one provided Instance interface to one consuming Instance
          or DevelopmentService. It is a KRM intent object: the controller copies only
          allowlisted runtime Secret keys and status never contains credential values.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConnectionSpec is immutable because changing either identity or mapping in
              place can momentarily deliver credentials to the wrong workload. Replace the
              object to change a binding.
            properties:
              mappings:
                description: Empty selects all mappings declared by the target interface.
                items:
                  properties:
                    sourceKey:
                      pattern: ^[A-Za-z0-9._-]+$
                      type: string
                    targetKey:
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                  required:
                  - sourceKey
                  - targetKey
                  type: object
                maxItems: 32
                type: array
              source:
                properties:
                  instanceRef:
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  interface:
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                required:
                - instanceRef
                - interface
                type: object
              target:
                properties:
                  interface:
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  kind:
                    enum:
                    - Instance
                    - DevelopmentService
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: 'UID is mandatory: a same-name recreation must never
                      inherit credentials.'
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - interface
                - kind
                - name
                - uid
                type: object
            required:
            - source
            - target
            type: object
            x-kubernetes-validations:
            - message: connection spec is immutable
              rule: self == oldSelf
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              managedSecretRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                  targetRuntimeIdentity:
                    type: string
                required:
                - name
                - namespace
                - targetRuntimeIdentity
                type: object
              observedGeneration:
                format: int64
                type: integer
              revision:
                description: |-
                  Revision is derived from non-secret object versions and mapping metadata;
                  it is safe to expose and changes whenever delivered credentials rotate.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
