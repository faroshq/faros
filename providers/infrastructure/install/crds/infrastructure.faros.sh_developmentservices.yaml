---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: developmentservices.infrastructure.faros.sh
spec:
  group: infrastructure.faros.sh
  names:
    categories:
    - faros
    kind: DevelopmentService
    listKind: DevelopmentServiceList
    plural: developmentservices
    shortNames:
    - devsvc
    singular: developmentservice
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sandboxRef.name
      name: Sandbox
      type: string
    - jsonPath: .spec.endpoint.port
      name: Port
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DevelopmentService declares one user application process that runs inside
          a universal coding sandbox and may be exposed through the platform's
          authenticated preview gateway. It is intentionally separate from
          Instance: a sandbox can host several independently supervised services.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DevelopmentServiceSpec is the project-owned desired process and endpoint
              contract. The shape intentionally mirrors App Studio's environment model:
              project/environment/component identify ownership, while command/endpoint
              describe one independently supervised process. Infrastructure owns all
              Kubernetes runtime objects and status; App Studio only writes this intent.
            properties:
              command:
                description: |-
                  Command is an argv-only process command. The dev agent never evaluates it
                  through a shell. Shell pipelines can be represented by an explicit shell
                  argv when a user intentionally asks for one.
                properties:
                  argv:
                    description: Argv contains the executable and arguments.
                    items:
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                  workingDirectory:
                    description: |-
                      WorkingDirectory is relative to the sandbox workspace root. Empty uses
                      the workspace root.
                    maxLength: 512
                    pattern: ^$|^[^/\\].*$
                    type: string
                required:
                - argv
                type: object
              componentRef:
                description: |-
                  ComponentRef optionally attributes the process to a project component.
                  It is not used as a Kubernetes selector and may be empty for an ad-hoc
                  listener created directly in the development environment.
                maxLength: 253
                pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              connectionRefs:
                description: |-
                  ConnectionRefs reserves the project connection attachment point. The
                  Infrastructure controller records and preserves these references but
                  does not resolve them until the Connection API is available.
                items:
                  type: string
                maxItems: 32
                type: array
              enabled:
                default: true
                description: |-
                  Enabled controls whether the process and preview route are active while
                  retaining this resource's identity and status. A nil value has the same
                  meaning as true; a pointer distinguishes omission from an explicit false
                  before an apiserver default is applied.
                type: boolean
              endpoint:
                description: Endpoint is the network contract exposed by this service.
                properties:
                  healthPath:
                    description: |-
                      HealthPath is an optional HTTP path used for a readiness probe. Empty
                      means the process port is probed only.
                    maxLength: 512
                    pattern: ^$|^/.*
                    type: string
                  port:
                    description: Port is the process port inside the sandbox Pod.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  protocol:
                    default: HTTP
                    description: |-
                      Protocol is currently HTTP. HTTP servers may upgrade connections to
                      WebSocket through the same Gateway route.
                    enum:
                    - HTTP
                    type: string
                required:
                - port
                type: object
              environment:
                description: |-
                  Environment identifies the project environment. DevelopmentService is
                  currently only supported for the development environment.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              exposure:
                description: |-
                  Exposure controls preview access. Private uses the existing authenticated
                  access proxy; public uses the same route with the proxy's explicit
                  passthrough mode and is admitted only after App Studio's confirmation.
                properties:
                  visibility:
                    default: Private
                    description: |-
                      Visibility is private by default. Public is an explicit opt-in and is
                      enforced by the existing access-proxy mode rather than a second route.
                    enum:
                    - Private
                    - Public
                    type: string
                type: object
              projectRef:
                description: |-
                  ProjectRef identifies the project that owns this service. The UID is
                  carried so a recreated project with the same name cannot inherit it.
                properties:
                  name:
                    description: Name is the Project name in the tenant workspace.
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the Project UID observed at binding time.
                    maxLength: 128
                    type: string
                required:
                - name
                type: object
              restartPolicy:
                default: Always
                description: |-
                  RestartPolicy determines whether a stopped process is restarted by the
                  service supervisor.
                enum:
                - Always
                - OnFailure
                - Never
                type: string
              sandboxRef:
                description: |-
                  SandboxRef identifies the project-scoped universal coding sandbox. UID
                  prevents a deleted-and-recreated sandbox with the same name from being
                  accidentally reused.
                properties:
                  name:
                    description: Name is the sandbox Instance name in the tenant workspace.
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the sandbox Instance UID observed at binding
                      time.
                    maxLength: 128
                    type: string
                required:
                - name
                type: object
            required:
            - command
            - endpoint
            - environment
            - projectRef
            - sandboxRef
            type: object
          status:
            description: |-
              DevelopmentServiceStatus is observed runtime state. URL/Host describe the
              stable configured endpoint; Ready is true only after the sandbox process,
              Service, and Gateway route are all observed healthy.
            properties:
              backendServiceRef:
                description: |-
                  BackendServiceRef identifies the provider-owned Service forwarding to the
                  sandbox Pod.
                properties:
                  name:
                    description: Name is the object name.
                    type: string
                  namespace:
                    description: Namespace is the object namespace.
                    type: string
                required:
                - name
                - namespace
                type: object
              conditions:
                description: |-
                  Conditions include SandboxReady, ProcessReady, PortListening,
                  RouteAccepted, and aggregate Ready. Every condition carries the
                  DevelopmentService generation it describes.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              host:
                description: Host is the stable per-service hostname allocated by
                  Infrastructure.
                type: string
              observedAt:
                description: ObservedAt is the provider time at which this status
                  was collected.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration identifies the latest spec generation processed by the
                  Infrastructure controller.
                format: int64
                type: integer
              process:
                description: Process reports the latest observed dev-agent process
                  state.
                properties:
                  lastExitCode:
                    description: LastExitCode is the most recent process exit code,
                      when known.
                    format: int32
                    type: integer
                  message:
                    description: Message is bounded human-readable process detail.
                    maxLength: 1024
                    type: string
                  phase:
                    description: Phase is Running, Stopped, or Failed.
                    type: string
                  portListening:
                    description: |-
                      PortListening reports that the process currently has a listener on the
                      declared port. It is deliberately distinct from route reachability.
                    type: boolean
                  reachable:
                    description: Reachable reports a successful loopback TCP probe
                      from the sandbox.
                    type: boolean
                  restartCount:
                    description: RestartCount changes whenever the process is restarted.
                    format: int64
                    type: integer
                  running:
                    description: Running reports whether the process currently exists.
                    type: boolean
                type: object
              ready:
                description: |-
                  Ready is a convenience projection of the Ready condition. Consumers
                  should still inspect Conditions for the reason a service is unavailable.
                type: boolean
              runtimeNamespace:
                description: |-
                  RuntimeNamespace is the sandbox workload namespace on the data-plane
                  cluster.
                type: string
              url:
                description: |-
                  URL is the HTTPS preview URL for Host. It may be present while Ready is
                  false; callers must use conditions to determine availability.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
