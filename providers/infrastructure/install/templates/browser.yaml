apiVersion: infrastructure.kedge.faros.sh/v1alpha1
kind: Template
metadata:
  name: browser
spec:
  displayName: "Browser (Playwright MCP)"
  description: "A headless Chromium driven by the official Playwright MCP server, exposed on a public URL behind a bearer-token gate — wire it to an agent as an `mcp` Connection and it gains real browsing tools: navigate, click, type, snapshot."
  category: Agent tools
  version: 0.1.0
  backend: kro
  # tokenSecretRef must name a Secret that already exists in the tenant's
  # default namespace — create the agents Connection first and the sample
  # value is the Secret it minted.
  sampleValues:
    name: browser
    tokenSecretRef: kedge-agents-conn-browser
    size: small
  # Operational guidance for AI agents discovering this template over MCP.
  agent:
    usage: |
      Provisions a PRIVATE headless browser: Chromium plus the official
      Playwright MCP server, published on a public HTTPS URL and gated by a
      bearer token minted in-graph. Choose this when an agent has to drive a
      real browser — a page that renders its content with JavaScript, a flow
      behind a login or a form, a multi-step click-through, a screenshot or an
      accessibility snapshot of what a page actually looks like.

      CREATE THE CONNECTION FIRST — the token flows from it, not the other way
      round. The instance's gate and the MCP client must share one bearer token,
      and a token generated inside the cluster could never be read back out. So
      the tenant owns it: an agents `mcp` Connection already stores its
      credential as a Secret in the tenant workspace
      (`kedge-agents-conn-<connection>`, key `token`), and this template's
      `tokenSecretRef` input names that Secret. The platform copies it into the
      instance's namespace; the token is never duplicated into a spec.

      ORDER OF OPERATIONS:
        1. Create the `mcp` Connection in the agents provider with any token
           value you like, so its Secret exists. Leave baseURL unset for now.
        2. Provision this template with tokenSecretRef = that Secret's name.
        3. Set the Connection's baseURL to status.mcpURL — the full
           streamable-HTTP endpoint, copied verbatim; it already ends in /mcp.
      The MCP client sends the token as `Authorization: Bearer <token>`, which
      is exactly what the gate wants. Reference that Connection from a toolset
      or agent and Playwright's tools appear to the model as
      `<connection>__browser_*` — browser_navigate, browser_click,
      browser_type, browser_snapshot, browser_take_screenshot and the rest of
      the upstream set. Rotating the token is a Secret update — the bridge
      re-copies it on the next reconcile.

      WHEN NOT TO USE IT. A browser instance is expensive and slow next to the
      alternatives, so reach for it last:
        • Plain page text — use `web_fetch`. It is one HTTP request; a browser
          round-trip is a page load, a render and an accessibility dump.
        • Finding pages — use `web_search` (the searxng template). The browser
          does not search, it visits.
      Use the browser when, and only when, the page genuinely needs JavaScript
      execution, a session/login, or interaction.

      IT IS STATEFUL, AND EFFECTIVELY SINGLE-SESSION. One instance is one
      Chromium: the page you navigated to stays open, cookies and logins
      persist between tool calls, and the tools act on whatever the current
      page is. Two agents pointed at the same instance will fight over the same
      tab — provision one instance per agent that needs concurrent browsing.
      A pod restart drops all of it (open tabs, cookies, logins); nothing here
      is persisted, so treat a session as disposable and re-establish state
      rather than assuming it survived.

      INPUTS you set when provisioning: name and tokenSecretRef (both
      required), size, expose.hostnamePrefix. The platform stamps
      spec.expose.fqdn — do not set it. There is no headless toggle: the
      upstream container image supports headless Chromium only, and it has no
      display to render into.
    prerequisites:
      - "A Secret in the tenant's default namespace with a 'token' key holding the bearer token the instance's gate will require — normally the agents Connection Secret 'kedge-agents-conn-<connection>', so one credential serves both sides. Name it in the tokenSecretRef input; provisioning fails loudly if it does not exist."
    outputs:
      - "status.mcpURL — the full MCP endpoint (…/mcp). This is the value to paste into an mcp Connection's baseURL."
      - "status.url — the public HTTPS base URL (status.mcpURL without the /mcp suffix); status.host is the bare hostname."
      - "status.ready — ready replica count for the browser Deployment."
      - "The bearer token is whatever the tokenSecretRef Secret holds under 'token' — the same Secret the Connection reads; no status field republishes it."
  # ── Portal presentation ───────────────────────────────────────────────
  view:
    columns:
      - header: MCP endpoint
        value: "${status.mcpURL}"
        type: link
      - header: Size
        path: spec.size
        type: badge
    detail:
      - title: Access
        fields:
          - label: MCP endpoint
            value: "${status.mcpURL}"
            type: link
          - label: Hostname
            path: status.host
            type: code
      - title: Configuration
        fields:
          - label: Size
            path: spec.size
            type: badge
          - label: Token secret
            path: spec.tokenSecretRef
            type: code
      - title: Readiness
        fields:
          - label: Browser
            path: status.ready
  instanceCRD:
    group: infrastructure.kedge.faros.sh
    version: v1alpha1
    resource: browsers
    kind: Browser
  # ── Tenant-facing inputs ──────────────────────────────────────────────
  # Two fields are populated by the instance controller, NOT the tenant:
  #   - expose.fqdn       the public hostname, computed as
  #                       <prefix|name>-<tenantHash>.<appBaseDomain>
  #   - tokenSecretName   the runtime Secret the controller bridges the token
  #                       named by tokenSecretRef into (key: token)
  #
  # No `headless` input: the upstream image ships an entrypoint that hard-codes
  # --headless and, per upstream, supports headless chromium only. An input that
  # could not change the behaviour would just be a lie in the schema.
  schema:
    type: object
    properties:
      name:
        type: string
        description: "Logical name; used as the resource-name prefix in the tenant namespace and the default hostname prefix."
      # The gate's credential is a REFERENCE, never a value: this instance's only
      # consumer is an MCP Connection on another cluster, so the token has to be
      # one the tenant already holds. The controller bridges the named Secret
      # into the runtime namespace as <name>-access.
      tokenSecretRef:
        type: string
        description: "Name of a Secret in your default namespace whose 'token' key is the bearer token this instance's gate will require. Point it at the agents Connection Secret ('kedge-agents-conn-<connection>') so the browser and the Connection share one credential. Rotating that Secret rotates the gate."
      tokenSecretName:
        type: string
        description: "Computed by the platform — do NOT set. The name the bridged token Secret takes in the runtime namespace."
      size:
        type: string
        enum: ["small", "medium", "large"]
        default: "small"
        description: "Chromium memory bucket — container limit and the matching /dev/shm size (small=1Gi/256Mi, medium=2Gi/512Mi, large=4Gi/1Gi). Heavy single-page apps, many open tabs, and full-page screenshots all push this up; a tab that dies with 'Target closed' is the symptom of being under-sized."
      # default: {} so nested defaults apply and the controller can stamp fqdn
      # onto an instance that omitted the expose object.
      expose:
        type: object
        default: {}
        properties:
          hostnamePrefix:
            type: string
            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 50
            description: "Left-most DNS label. Defaults to .name. Final host = <prefix>-<tenantHash>.<appBaseDomain>."
          fqdn:
            type: string
            description: "Computed by the platform — do NOT set. The public hostname the instance is served on."
    required:
      - name
      - tokenSecretRef

  # ── backendConfig: the kro resource graph ─────────────────────────────
  # Every resource sets namespace: default — the control-plane/data-plane split
  # materializes these on the runtime cluster and remaps that to the per-tenant
  # namespace. ${kedge.gatewayName} / ${kedge.gatewayNamespace} are substituted
  # for the platform's configured Gateway API parent before the RGD is authored.
  #
  # Pod shape mirrors the searxng template: the MCP server binds 127.0.0.1 and
  # an nginx sidecar on 0.0.0.0:8080 is the only way in. Playwright MCP has NO
  # authentication of its own, and an unauthenticated one on the public internet
  # is a remote-controlled browser with your egress IP — the gate is the whole
  # security boundary.
  backendConfig:
    resources:
      # No Secret, ServiceAccount or generator Job in this graph: the one
      # credential this instance needs is the tenant's, bridged in by the
      # controller as <name>-access, and Chromium itself has nothing to keep.
      #
      # The bearer gate. nginx:alpine's entrypoint renders
      # /etc/nginx/templates/*.template through envsubst into /etc/nginx/conf.d,
      # which is how the token reaches the config: nginx cannot read a Secret
      # into a directive, but it CAN be handed one as an environment variable.
      # NGINX_ENVSUBST_FILTER restricts substitution to AUTH_TOKEN so nginx's
      # own $host / $http_authorization variables survive untouched.
      #
      # $AUTH_TOKEN is written WITHOUT braces on purpose: ${...} is kro's
      # expression syntax and kro would try to resolve it as CEL.
      - id: nginxConfig
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-gate
            namespace: default
          data:
            default.conf.template: |
              server {
                listen 8080;
                server_tokens off;

                # Unauthenticated liveness for kubelet. The MCP endpoint itself
                # cannot serve as a probe: a GET without a session is an error
                # by protocol, not a health signal.
                location = /healthz {
                  access_log off;
                  return 200 "ok";
                }

                location / {
                  # "if" inside a location is only well-defined when its body is
                  # a rewrite-module directive; `return` is exactly that case,
                  # and proxy_pass stays outside the if. envsubst substitutes
                  # $AUTH_TOKEN at container start, so the comparison is against
                  # a literal by the time nginx parses this.
                  if ($http_authorization != "Bearer $AUTH_TOKEN") {
                    return 401;
                  }
                  proxy_pass http://127.0.0.1:8931;
                  proxy_set_header Host $host;
                  # Streamable HTTP answers with an SSE stream that stays open
                  # for the life of the MCP session. Buffering would hold each
                  # event until a block filled (the client would appear to hang
                  # mid-tool-call), and the default 60s read timeout would tear
                  # down an idle-but-live session. HTTP/1.1 with a cleared
                  # Connection header keeps the upstream leg unchunked and
                  # un-closed between events.
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_buffering off;
                  proxy_cache off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                }
              }

      - id: deployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            # Single replica, and deliberately so: an MCP session is bound to
            # the browser process that started it, so a second replica behind
            # the same Service would answer half the calls from a browser that
            # never saw the first navigation.
            replicas: 1
            selector:
              matchLabels:
                app: ${schema.spec.name}
            # A browser holds live sessions; rolling a second pod in alongside
            # would hand some calls to a cold Chromium. Replace, don't overlap.
            strategy:
              type: Recreate
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}
              spec:
                containers:
                  - name: browser
                    image: mcr.microsoft.com/playwright/mcp:latest
                    # The image ENTRYPOINT is
                    # `node /app/cli.js --headless --browser chromium --no-sandbox`,
                    # so args only append the HTTP-server flags. --no-sandbox is
                    # already there and is required: Chromium's setuid sandbox
                    # needs privileges this pod does not have, and the gate plus
                    # the loopback bind are what contain it instead.
                    args:
                      - --port
                      - "8931"
                      - --host
                      - "127.0.0.1"
                    volumeMounts:
                      # Chromium puts renderer shared memory in /dev/shm. The
                      # container default is 64Mi, and overflowing it kills the
                      # tab with the classic "Target closed"/"Page crashed"
                      # error, so it gets a tmpfs scaled to the size bucket.
                      - name: dshm
                        mountPath: /dev/shm
                    # tmpfs pages count against the container's memory limit, so
                    # the /dev/shm bucket is a quarter of the limit — enough for
                    # renderer surfaces without letting shared memory alone
                    # consume the whole allowance. A probe on the loopback port
                    # is the only honest readiness signal: kubelet reaches the
                    # pod IP, not 127.0.0.1, so an httpGet cannot see this
                    # server. node is the image's own runtime, so no extra
                    # tooling is needed.
                    readinessProbe:
                      exec:
                        command:
                          - node
                          - -e
                          - "require('net').connect(8931,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    # Single-quoted: the CEL ternaries contain ": ", which YAML
                    # would otherwise read as mappings.
                    resources:
                      requests:
                        cpu: 200m
                        memory: '${schema.spec.size == "small" ? "512Mi" : (schema.spec.size == "medium" ? "1Gi" : "2Gi")}'
                      limits:
                        memory: '${schema.spec.size == "small" ? "1Gi" : (schema.spec.size == "medium" ? "2Gi" : "4Gi")}'
                  - name: auth
                    image: nginx:alpine
                    env:
                      # The tenant's own token, bridged into this namespace by
                      # the instance controller. If the bridge hasn't landed yet
                      # the container simply won't start, and kubelet retries —
                      # the gate can never come up open.
                      - name: AUTH_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: ${schema.spec.tokenSecretName}
                            key: token
                      - name: NGINX_ENVSUBST_FILTER
                        value: "AUTH_TOKEN"
                    ports:
                      - containerPort: 8080
                    volumeMounts:
                      - name: gate
                        mountPath: /etc/nginx/templates
                        readOnly: true
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      periodSeconds: 10
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        memory: 64Mi
                volumes:
                  - name: dshm
                    emptyDir:
                      medium: Memory
                      sizeLimit: '${schema.spec.size == "small" ? "256Mi" : (schema.spec.size == "medium" ? "512Mi" : "1Gi")}'
                  - name: gate
                    configMap:
                      name: ${nginxConfig.metadata.name}

      # Fronts the gate only. Nothing in the cluster is given a route to the
      # MCP server's own port.
      - id: service
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}
            ports:
              - port: 8080
                targetPort: 8080

      # ──────────────── HTTPRoute (Gateway API exposure layer) ────────────────
      # Public on purpose: the agents provider may run on a different cluster
      # than this instance, so an in-cluster Service would be unreachable. TLS
      # terminates at the Gateway edge, which programs the DNS record + tunnel
      # route from this hostname.
      - id: httpRoute
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: ${kedge.gatewayName}
                namespace: ${kedge.gatewayNamespace}
            hostnames:
              - ${schema.spec.expose.fqdn}
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: ${schema.spec.name}
                    port: 8080
    # url/host are read from the HTTPRoute (this kro fork forbids ${schema.*} in
    # status), same as the application/simple-webapp templates.
    # ${kedge.appPublicPort} is substituted by the kro backend before kro sees
    # this CEL. mcpURL is the field a user copies: the streamable-HTTP endpoint
    # the upstream server serves MCP on is /mcp, so spelling it out here removes
    # the one guess that silently breaks an mcp Connection.
    status:
      url: ${"https://" + httpRoute.spec.hostnames[0] + "${kedge.appPublicPort}"}
      mcpURL: ${"https://" + httpRoute.spec.hostnames[0] + "${kedge.appPublicPort}" + "/mcp"}
      host: ${httpRoute.spec.hostnames[0]}
      ready: ${deployment.status.readyReplicas}
