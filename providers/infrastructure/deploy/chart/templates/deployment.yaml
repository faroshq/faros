{{- if not .Values.operator.enabled }}
# Legacy single-Deployment serve (bootstrap.* init-container flow). When
# operator.enabled=true the operator owns the provider serve Deployment on the
# runtime cluster instead, so this is skipped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrastructure.fullname" . }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "infrastructure.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infrastructure.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "infrastructure.serviceAccountName" . }}
      {{- $centralName := (include "infrastructure.centralKroSecretName" .) }}
      {{- if and .Values.bootstrap.seedTemplates (not .Values.bootstrap.enabled) }}
        {{- fail "bootstrap.seedTemplates=true requires bootstrap.enabled=true because the init container owns catalog seeding" }}
      {{- end }}
      {{- if and .Values.bootstrap.seedTemplates (not $centralName) }}
        {{- fail "bootstrap.seedTemplates=true requires centralKro.kubeconfig or centralKro.kubeconfigSecretRef.name so seeded kro templates can reconcile" }}
      {{- end }}
      {{- if .Values.bootstrap.enabled }}
      {{- if not (include "infrastructure.bootstrapSecretName" .) }}
        {{- fail "bootstrap.enabled=true with kubeconfigSource=supplied requires bootstrap.kcpKubeconfig (inline) or bootstrap.kcpKubeconfigSecretRef.name" }}
      {{- end }}
      initContainers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            # The admin/supplied kubeconfig is bootstrap-only. Init mints a
            # least-privilege runtime identity into the shared emptyDir below;
            # the serve container never mounts this input credential.
            - name: INFRASTRUCTURE_ADMIN_KUBECONFIG
              value: /var/run/secrets/faros-admin/faros-provider-kubeconfig
            {{- if eq .Values.bootstrap.kubeconfigSource "supplied" }}
            # A supplied kubeconfig may be root-scoped, so retarget init at the
            # provider workspace. The hub-minted kubeconfig already targets it.
            - name: INFRASTRUCTURE_WORKSPACE_PATH
              value: {{ .Values.bootstrap.workspacePath | quote }}
            {{- end }}
            # This file is the only kcp credential consumed by serve.
            - name: INFRASTRUCTURE_KUBECONFIG
              value: /var/run/secrets/faros-runtime/faros-provider-kubeconfig
            {{- if not .Values.bootstrap.seedTemplates }}
            - name: INFRASTRUCTURE_SKIP_SEED_TEMPLATES
              value: "1"
            {{- end }}
            {{- if $centralName }}
            - name: KRO_KUBECONFIG
              value: /var/run/secrets/kro/kubeconfig
            {{- end }}
            {{- if .Values.catalogEntry.enabled }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it to
            # the hosting cluster. It is rendered into a ConfigMap (mounted below)
            # and init self-registers it into the provider workspace via the
            # provider kubeconfig.
            - name: FAROS_CATALOGENTRY_FILE
              value: /etc/faros/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: faros-provider-admin-kubeconfig
              mountPath: /var/run/secrets/faros-admin
              readOnly: true
            - name: faros-runtime-kubeconfig
              mountPath: /var/run/secrets/faros-runtime
            {{- if $centralName }}
            - name: kro-kubeconfig
              mountPath: /var/run/secrets/kro
              readOnly: true
            {{- end }}
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/faros/catalogentry
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            # Controller-aware readiness. The HTTP process stays live while the
            # required Template controller recovers from kcp/bootstrap races.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: "8081"
            - name: FAROS_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: FAROS_PROVIDER_NAME
              value: "infrastructure"
            # Production infrastructure always requires its Template
            # controller. A misspelled/missing kubeconfig must keep /readyz
            # false rather than silently degrading to the REST-only surface.
            - name: INFRASTRUCTURE_CONTROLLER_MODE
              value: "required"
            {{- if .Values.hub.insecure }}
            - name: FAROS_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: FAROS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
            # The serve process consumes the init-minted/provider-workspace
            # kubeconfig through the infrastructure controller contract.
            - name: INFRASTRUCTURE_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            {{- if not .Values.bootstrap.seedTemplates }}
            - name: INFRASTRUCTURE_SKIP_SEED_TEMPLATES
              value: "1"
            {{- end }}
            {{- if $centralName }}
            - name: KRO_KUBECONFIG
              value: /var/run/secrets/kro/kubeconfig
            {{- end }}
            {{- if and .Values.application.baseDomain (not .Values.publishing.baseDomain) }}
            # Enables the Application instance controller (fqdn stamp + OIDC
            # client-secret bridge). Without it (and KRO_KUBECONFIG) the
            # controller stays disabled. The zone apps are served under, e.g.
            # "apps.example.com".
            - name: FAROS_APP_BASE_DOMAIN
              value: {{ .Values.application.baseDomain | quote }}
            {{- end }}
            {{- if and .Values.application.gateway.name (not .Values.publishing.gateway.name) }}
            # Gateway API parent the Application HTTPRoutes attach to
            # (${faros.gatewayName}); defaults to "cloudflare-tunnel" in-binary.
            - name: FAROS_GATEWAY_NAME
              value: {{ .Values.application.gateway.name | quote }}
            {{- end }}
            {{- if and .Values.application.gateway.namespace (not .Values.publishing.gateway.namespace) }}
            # The Gateway's namespace (${faros.gatewayNamespace}); defaults to
            # "cfgate-system" in-binary.
            - name: FAROS_GATEWAY_NAMESPACE
              value: {{ .Values.application.gateway.namespace | quote }}
            {{- end }}
            {{- with .Values.publishing.baseDomain }}
            - name: FAROS_APP_BASE_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.publishing.accessProxyImage }}
            - name: FAROS_ACCESS_PROXY_IMAGE
              value: {{ . | quote }}
            {{- end }}
            - name: FAROS_ACCESS_HUB_URL
              value: {{ default .Values.hub.url .Values.publishing.hubURL | quote }}
            {{- with .Values.publishing.hubPublicURL }}
            - name: FAROS_ACCESS_HUB_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.publishing.insecure }}
            - name: FAROS_ACCESS_HUB_INSECURE
              value: "true"
            {{- end }}
            - name: FAROS_ACCESS_PUBLIC_SCHEME
              value: {{ .Values.publishing.publicScheme | default "https" | quote }}
            {{- if gt (int .Values.publishing.publicPort) 0 }}
            - name: FAROS_APP_PUBLIC_PORT
              value: {{ .Values.publishing.publicPort | quote }}
            {{- end }}
            {{- with .Values.publishing.gateway.name }}
            - name: FAROS_GATEWAY_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.publishing.gateway.namespace }}
            - name: FAROS_GATEWAY_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.tenantLimitRange.enabled }}
            # Opt out of stamping the faros-defaults LimitRange into tenant
            # namespaces (for clusters that manage resource policy themselves).
            - name: FAROS_TENANT_LIMITRANGE
              value: "disabled"
            {{- end }}
            {{- with .Values.development.agentImage }}
            # Dev-mode agent injector image (${faros.devAgentImage}).
            - name: FAROS_DEV_AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.development.previewConsole.verificationJWKS }}
            # Current and optional previous public ES256 keys for the
            # development preview-console bridge. Signing keys remain in App
            # Studio and are never passed to the infrastructure provider.
            - name: FAROS_PREVIEW_CONSOLE_VERIFICATION_JWKS
              value: {{ . | quote }}
            {{- end }}
            {{- range $toolchain, $image := .Values.development.images }}
            {{- if $image }}
            # Dev-mode toolchain image (${faros.devImage.{{ $toolchain }}}).
            - name: FAROS_DEV_IMAGE_{{ $toolchain | upper | replace "-" "_" }}
              value: {{ $image | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- if .Values.bootstrap.enabled }}
            - name: faros-runtime-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
            {{- else }}
            - name: faros-provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
            {{- end }}
            {{- if $centralName }}
            - name: kro-kubeconfig
              mountPath: /var/run/secrets/kro
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.bootstrap.enabled }}
        - name: faros-runtime-kubeconfig
          emptyDir: {}
        {{- end }}
        {{- if and .Values.bootstrap.enabled .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "infrastructure.fullname" . }}-catalogentry
        {{- end }}
        {{- if .Values.bootstrap.enabled }}
        - name: faros-provider-admin-kubeconfig
          secret:
            # Bootstrap input only. Serve mounts the init-minted runtime
            # kubeconfig from faros-runtime-kubeconfig instead.
            secretName: {{ include "infrastructure.bootstrapSecretName" . }}
            items:
              - key: {{ include "infrastructure.bootstrapSecretKey" . }}
                path: faros-provider-kubeconfig
        {{- else }}
        - name: faros-provider-kubeconfig
          secret:
            # Externally bootstrapped mode, no init container: wait for the
            # provider kubeconfig before starting. The hub provisions the
            # workspace and credential, but an out-of-band workflow must have
            # installed the provider-owned APIs before this pod can be ready.
            secretName: {{ .Values.providerKubeconfig.secretName }}
            optional: false
            items:
              - key: kubeconfig
                path: faros-provider-kubeconfig
        {{- end }}
        {{- if $centralName }}
        - name: kro-kubeconfig
          secret:
            secretName: {{ $centralName }}
            items:
              - key: {{ include "infrastructure.centralKroSecretKey" . }}
                path: kubeconfig
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
