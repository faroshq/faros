## faros-secrets-provider values
## See providers/secrets/README.md for the deploy guide and credential
## conventions the portal expects.

# Container image. Build with: docker build -t IMAGE providers/secrets/
image:
  repository: ghcr.io/faroshq/faros-secrets-provider
  tag: ""  # empty → defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# The controllers are level-triggered and all state lives in kcp, so more than
# one replica only burns quota on duplicate reconciles.
replicaCount: 1

service:
  type: ClusterIP
  port: 8090

# Hub the provider POSTs heartbeats to. Must be reachable from the provider pod
# (in-cluster Service DNS works).
hub:
  url: https://faros-hub.faros.svc.cluster.local:9443
  # Bearer token used in the heartbeat POST. Provided as a Secret because it
  # MUST NOT land in values.yaml in plaintext for prod.
  tokenSecretRef:
    name: faros-secrets-hub-token
    key: token
  # Skip TLS verification on heartbeat — dev only, defaults off.
  insecure: false

# Secret the provider mounts read-only at
# /var/run/secrets/faros/faros-provider-kubeconfig to reach kcp
# (FAROS_PROVIDER_KUBECONFIG). Both the init container and serve mount it.
providerKubeconfig:
  secretName: faros-provider-kubeconfig

# Tenant credential resolution. Empty → the provider default ("default"), the
# namespace the portal writes SecretStore token Secrets into. Override only if
# an admin pushes credential Secrets into a namespace tenants cannot write to.
tenant:
  credentialsNamespace: ""

# When true, the chart renders the CatalogEntry (which registers the provider
# with the hub) into a ConfigMap that the init container applies into the
# provider workspace via the provider kubeconfig. The CatalogEntry is a kcp
# resource, so it is NOT applied to the hosting cluster this chart installs
# into. Set to false to manage the CatalogEntry separately.
catalogEntry:
  enabled: true

serviceAccount:
  create: true
  name: ""   # empty → release-name

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# Optional name overrides + pod-level scheduling controls.
nameOverride: ""
fullnameOverride: ""
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
