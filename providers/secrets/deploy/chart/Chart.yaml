apiVersion: v2
name: faros-secrets-provider
description: |
  faros provider that projects secrets from external stores (HashiCorp Vault
  KV v2 today) into tenant workspaces as synced Secrets with refresh and
  rotation status. Ships the provider Deployment, ClusterIP Service, and the
  CatalogEntry that registers the provider — with its two tenant-authored
  APIResourceSchemas (SecretStore, SyncedSecret) — with the faros hub.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - faros
  - secrets
  - vault
  - external-secrets
home: https://github.com/faroshq/faros
sources:
  - https://github.com/faroshq/faros/tree/main/providers/secrets
maintainers:
  - name: faros maintainers
