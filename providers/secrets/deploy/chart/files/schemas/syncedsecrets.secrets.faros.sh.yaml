apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260817-6b19c407.syncedsecrets.secrets.faros.sh
spec:
  group: secrets.faros.sh
  names:
    categories:
    - faros
    kind: SyncedSecret
    listKind: SyncedSecretList
    plural: syncedsecrets
    shortNames:
    - ssync
    singular: syncedsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.storeRef.name
      name: Store
      type: string
    - jsonPath: .spec.refreshInterval
      name: Refresh
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      description: |-
        SyncedSecret declaratively projects secret material from a SecretStore into
        a workspace Secret, with ExternalSecret-style semantics: a refresh interval,
        key remapping, and last-sync/version status. It is what infrastructure
        templates and app-studio consume instead of hand-placed Secrets.

        The projected Secret is written in the SyncedSecret's own namespace, carries
        an ownerReference back to it, and is labeled as provider-managed — the
        controller refuses to overwrite a Secret it does not own.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: SyncedSecretSpec is the desired state.
          properties:
            data:
              description: |-
                Data maps individual remote properties onto Secret keys. Use for key
                remapping or cherry-picking; use DataFrom to pull a whole path.
                At least one of data / dataFrom must be set.
              items:
                description: SyncedSecretData maps one remote property onto one Secret
                  key.
                properties:
                  remoteRef:
                    description: RemoteRef addresses the remote value.
                    properties:
                      path:
                        description: |-
                          Path is the location within the store (for Vault KV v2, the path
                          under the configured mount, without the /data/ infix).
                        maxLength: 1024
                        minLength: 1
                        type: string
                      property:
                        description: |-
                          Property selects one key of the value at Path. Empty in a DataFrom
                          entry pulls all properties; required semantics in a Data entry:
                          empty means the property named after SecretKey.
                        maxLength: 253
                        type: string
                    required:
                    - path
                    type: object
                  secretKey:
                    description: SecretKey is the key in the projected Secret's data.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - remoteRef
                - secretKey
                type: object
              maxItems: 64
              type: array
            dataFrom:
              description: |-
                DataFrom pulls every property at each remote path into the projected
                Secret verbatim. Later entries win on key collisions; explicit Data
                mappings win over DataFrom.
              items:
                description: RemoteReference addresses secret material in the external
                  store.
                properties:
                  path:
                    description: |-
                      Path is the location within the store (for Vault KV v2, the path
                      under the configured mount, without the /data/ infix).
                    maxLength: 1024
                    minLength: 1
                    type: string
                  property:
                    description: |-
                      Property selects one key of the value at Path. Empty in a DataFrom
                      entry pulls all properties; required semantics in a Data entry:
                      empty means the property named after SecretKey.
                    maxLength: 253
                    type: string
                required:
                - path
                type: object
              maxItems: 16
              type: array
            refreshInterval:
              default: 1h
              description: |-
                RefreshInterval is how often the projection is re-read from the
                external store, picking up rotated values. Defaults to 1h.
              type: string
            storeRef:
              description: StoreRef names the (cluster-scoped) SecretStore to read
                from.
              properties:
                name:
                  description: Name of the SecretStore.
                  maxLength: 253
                  minLength: 1
                  type: string
              required:
              - name
              type: object
            target:
              description: |-
                Target configures the projected Secret. Empty projects into a Secret
                named after the SyncedSecret in its own namespace.
              properties:
                name:
                  description: |-
                    Name of the projected Secret. Empty defaults to the SyncedSecret's
                    own name.
                  maxLength: 253
                  type: string
              type: object
          required:
          - storeRef
          type: object
        status:
          description: SyncedSecretStatus is the observed state.
          properties:
            conditions:
              description: Conditions follows the standard Kubernetes conditions pattern.
              items:
                description: Condition contains details for one aspect of the current
                  state of this API Resource.
                properties:
                  lastTransitionTime:
                    description: |-
                      lastTransitionTime is the last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      message is a human readable message indicating details about the transition.
                      This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: |-
                      observedGeneration represents the .metadata.generation that the condition was set based upon.
                      For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                      with respect to the current state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: |-
                      reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      Producers of specific condition types may define expected values and meanings for this field,
                      and whether the values are considered a guaranteed API.
                      The value should be a CamelCase string.
                      This field may not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            lastSyncTime:
              description: LastSyncTime is when the projection last succeeded.
              format: date-time
              type: string
            observedGeneration:
              description: ObservedGeneration mirrors metadata.generation last reconciled.
              format: int64
              type: integer
            secretName:
              description: SecretName is the projected Secret's name once written.
              maxLength: 253
              type: string
            syncedKeys:
              description: SyncedKeys is the number of keys in the projected Secret.
              format: int32
              type: integer
            syncedVersion:
              description: |-
                SyncedVersion is a content hash of the projected data (sha256 over
                sorted key/value pairs, hex, prefixed "sha256:"). Changes exactly when
                the projected material changes, so consumers can watch for rotation
                without reading the Secret.
              maxLength: 100
              type: string
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
