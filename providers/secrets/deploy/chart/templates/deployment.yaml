apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secrets.fullname" . }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "secrets.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secrets.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "secrets.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Bootstrap the provider workspace (APIResourceSchemas, APIExport,
        # APIExportEndpointSlice, bind grant) using the SAME workspace-admin
        # kubeconfig the serve container runs with, supplied as the
        # providerKubeconfig Secret. Schemas are baked into the image at
        # /etc/faros/schemas (see Dockerfile). Idempotent.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["init"]
          env:
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            - name: FAROS_SCHEMAS_DIR
              value: /etc/faros/schemas
            {{- if .Values.catalogEntry.enabled }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it
            # to the hosting cluster. It is rendered into a ConfigMap (mounted
            # below) and init self-registers it into the provider workspace via
            # the provider kubeconfig.
            - name: FAROS_CATALOGENTRY_FILE
              value: /etc/faros/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: faros-provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/faros/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: FAROS_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: FAROS_PROVIDER_NAME
              value: "secrets"
            {{- if .Values.hub.insecure }}
            - name: FAROS_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: FAROS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
            # Points the multicluster controller manager at the onboarded
            # provider kubeconfig (mounted below).
            - name: FAROS_PROVIDER_KUBECONFIG
              value: /var/run/secrets/faros/faros-provider-kubeconfig
            {{- if .Values.tenant.credentialsNamespace }}
            - name: FAROS_TENANT_CREDENTIALS_NAMESPACE
              value: {{ .Values.tenant.credentialsNamespace | quote }}
            {{- end }}
          volumeMounts:
            - name: faros-provider-kubeconfig
              mountPath: /var/run/secrets/faros
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: faros-provider-kubeconfig
          secret:
            # Required input: the workspace-admin kubeconfig minted by the
            # platform admin via admin onboarding. Both the init container and
            # the serve container mount it.
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: faros-provider-kubeconfig
        {{- if .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "secrets.fullname" . }}-catalogentry
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
