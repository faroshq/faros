{{- if .Values.catalogEntry.enabled -}}
# CatalogEntry registers this provider with the faros hub for routing + the
# portal Enable flow. It is a kcp resource (providers.faros.sh/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (FAROS_CATALOGENTRY_FILE -> sdkinstall.Bootstrap).
#
# ⚠️ Keep in sync with providers/secrets/manifest.yaml (the dev copy) and
# init_cmd.go permissionClaims() — all three must match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "secrets.fullname" . }}-catalogentry
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.faros.sh/v1alpha1
    kind: CatalogEntry
    metadata:
      name: secrets
    spec:
      displayName: "Secrets"
      description: "Project secrets from external stores (Vault) into tenant workspaces — synced Secrets with refresh and rotation status."
      vendor: "faros"
      version: {{ .Chart.AppVersion | quote }}
      category: "Platform"
      iconURL: "/ui/providers/secrets/icon.svg"
      ui:
        url: "http://{{ include "secrets.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
        children:
          - displayName: Stores
            builtinRoute: stores
          - displayName: Synced Secrets
            builtinRoute: synced
      backend:
        url: "http://{{ include "secrets.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/healthz"
      apiExport:
        name: "secrets.providers.faros.sh"
        permissionClaims:
          - resource: secrets
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
{{- end }}
