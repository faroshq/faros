# Provider — declarative provisioning record (admin.faros.sh, admin-only).
# The hub's Provider controller creates root:faros:providers:secrets, its
# "provider" ServiceAccount, and the secrets-kubeconfig Secret in
# root:faros:system:providers. The APIExport/schemas/bind-grant come from the
# provider's own `init`; routing/UI from the companion CatalogEntry in
# manifest.yaml.
apiVersion: admin.faros.sh/v1alpha1
kind: Provider
metadata:
  name: secrets
spec:
  displayName: "Secrets"
