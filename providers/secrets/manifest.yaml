# secrets provider — register with the faros hub.
#
# Apply to the kcp workspace where the faros.sh APIExport is bound
# (typically root:faros:providers when running embedded kcp for development):
#
#   kubectl --kubeconfig kcp-admin.kubeconfig apply -f manifest.yaml
#
# This CatalogEntry registers routing and references apiExport.name. The
# provider's init command creates the APIExport, schemas, endpoint slice, and
# bind grant from deploy/chart/files/schemas, covering the SecretStore and
# SyncedSecret resources.
#
# ⚠️ Keep in sync with deploy/chart/templates/catalogentry.yaml (the prod copy)
# and init_cmd.go permissionClaims() — all three must match.
---
apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: secrets
spec:
  displayName: "Secrets"
  description: "Project secrets from external stores (Vault) into tenant workspaces — synced Secrets with refresh and rotation status."
  vendor: "faros"
  version: "0.1.0"
  category: "Platform"
  iconURL: "/ui/providers/secrets/icon.svg"
  # Local dev (Tilt / Makefile): the provider binary runs on the host at
  # PORT=8090 — distinct from the other providers (quickstart :8081 …
  # vibe-studio :8089). For in-cluster deployment, change to the Service DNS,
  # e.g. http://secrets.secrets.svc.cluster.local:8090.
  ui:
    url: "http://localhost:8090"
    indexPath: "/"
    children:
      - displayName: Stores
        builtinRoute: stores
      - displayName: Synced Secrets
        builtinRoute: synced
  backend:
    url: "http://localhost:8090"
    healthPath: "/healthz"
  apiExport:
    name: "secrets.providers.faros.sh"
    # The controllers read each SecretStore's credential Secret AND write the
    # SyncedSecret projections (create/update/delete) in the tenant workspace,
    # so the secrets claim needs write verbs — tenant Secrets are this
    # provider's legitimate domain. Projected Secrets are labeled
    # secrets.faros.sh/managed-by and the controller refuses to overwrite
    # unlabeled Secrets. tenantScoped: true auto-accepts on Enable.
    permissionClaims:
      - resource: secrets
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
