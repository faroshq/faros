version: 1
internal_events: true
action: agents_run_terminal
description: An Agents provider agent's run reached a terminal outcome, retaining separate agent and run identities.
owner: agents
product_group: agents
product_categories:
  - runs
identifiers:
  - org
  - workspace
  - resource
  - run
tiers:
  - free
  - premium
  - ultimate
milestone: "0.1"
status: active
introduced_by_url: https://github.com/faroshq/faros
retention_days: 90
privacy:
  class: pseudonymous
  pseudonymize: [org, workspace, resource, run]
  no_raw_content: true
additional_properties:
  outcome:
    description: The bounded terminal run outcome.
    type: string
    enum: [succeeded, failed, aborted]
