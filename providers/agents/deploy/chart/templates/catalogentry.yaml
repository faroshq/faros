{{- define "agents.catalogEntry" -}}
apiVersion: providers.faros.sh/v1alpha1
kind: CatalogEntry
metadata:
  name: agents
  annotations:
    providers.faros.sh/builtin: "false"
spec:
  displayName: "Agents"
  description: "Long-running personal AI agents: chat, scheduled runs, tools, and durable memory."
  vendor: "faros"
  version: {{ .Chart.AppVersion | quote }}
  category: "AI"
  iconURL: "/ui/providers/agents/icon.svg"
  # infrastructure is an OPTIONAL runtime dependency (file workspace, claude-code
  # runner) discovered at runtime, not a hard dependency — so it is intentionally
  # not listed here. The provider is fully functional against a bare hub.
  ui:
    url: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "agents.fullname" .) .Release.Namespace .Values.service.port) .Values.catalogEntry.uiURL | quote }}
    indexPath: "/"
  backend:
    # The hub backend proxy forwards /services/providers/agents/* here,
    # injecting the verified X-Faros-Tenant/X-Faros-User headers and the
    # caller's bearer token. The provider serves /api/* + /healthz.
    url: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "agents.fullname" .) .Release.Namespace .Values.service.port) .Values.catalogEntry.backendURL | quote }}
    healthPath: "/healthz"
  # Reference-only: the APIExport, schemas, slice, and bind grant are created by
  # this chart's init container (provider `init`, via the faros-provider-sdk).
  apiExport:
    name: "agents.faros.sh"
    requiredResources:
      - group: agents.faros.sh
        name: agents
      - group: agents.faros.sh
        name: connections
      - group: agents.faros.sh
        name: schedules
      - group: agents.faros.sh
        name: toolsets
      - group: agents.faros.sh
        name: triggers
    permissionClaims:
      - resource: secrets
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
      # Per-agent identity for background runs. A scheduled run has no user to
      # act as, so the provider mints the agent a ServiceAccount in the tenant
      # workspace and calls the platform data plane as that identity. See
      # api/agentidentity.go. Create-only on the RBAC objects: the provider
      # grants the agent read access to instances and can never widen it to
      # anything else, because it cannot write arbitrary roles.
      - resource: serviceaccounts
        verbs: ["get", "create"]
        tenantScoped: true
      - resource: clusterroles
        group: rbac.authorization.k8s.io
        verbs: ["get", "create"]
        tenantScoped: true
      - resource: clusterrolebindings
        group: rbac.authorization.k8s.io
        verbs: ["get", "create"]
        tenantScoped: true
      # Service-to-service callers use delegated review APIs in the target
      # tenant's APIExport virtual workspace. Existing bindings explicitly
      # review and accept additions in the provider catalog.
      - group: authentication.k8s.io
        resource: tokenreviews
        verbs: [create]
        tenantScoped: true
      - group: authorization.k8s.io
        resource: subjectaccessreviews
        verbs: [create]
        tenantScoped: true
{{- end -}}

{{- if .Values.catalogEntry.enabled -}}
{{- if .Values.catalogEntry.renderAsConfigMap }}
# CatalogEntry registers this provider with the faros hub for routing + the
# portal Enable flow. It is a kcp resource (providers.faros.sh/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (FAROS_CATALOGENTRY_FILE -> sdkinstall.Bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agents.fullname" . }}-catalogentry
  labels:
    {{- include "agents.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
{{ include "agents.catalogEntry" . | indent 4 }}
{{- end }}
{{- end }}
