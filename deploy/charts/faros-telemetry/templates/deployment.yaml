{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
{{- fail "tls.existingSecret is required when tls.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "faros-telemetry.fullname" . }}
  labels:
    {{- include "faros-telemetry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "faros-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "faros-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: telemetry
          image: {{ include "faros-telemetry.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: {{ if include "faros-telemetry.tlsEnabled" . }}https{{ else }}http{{ end }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: TELEMETRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.database.name is required" .Values.secrets.database.name }}
                  key: {{ .Values.secrets.database.key }}
            - name: TELEMETRY_INGEST_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.ingestTokens.name is required" .Values.secrets.ingestTokens.name }}
                  key: {{ .Values.secrets.ingestTokens.key }}
            - name: TELEMETRY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.adminToken.name is required" .Values.secrets.adminToken.name }}
                  key: {{ .Values.secrets.adminToken.key }}
            - name: TELEMETRY_RAW_RETENTION
              value: {{ .Values.retention.raw | quote }}
            - name: TELEMETRY_AGGREGATE_RETENTION
              value: {{ .Values.retention.aggregate | quote }}
            - name: TELEMETRY_JANITOR_INTERVAL
              value: {{ .Values.janitorInterval | quote }}
            - name: TELEMETRY_MAX_BATCH_EVENTS
              value: {{ .Values.ingest.maxBatchEvents | quote }}
            - name: TELEMETRY_MAX_EVENT_BYTES
              value: {{ .Values.ingest.maxEventBytes | quote }}
            {{- if include "faros-telemetry.tlsEnabled" . }}
            - name: TELEMETRY_TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TELEMETRY_TLS_KEY_FILE
              value: /tls/tls.key
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ if include "faros-telemetry.tlsEnabled" . }}https{{ else }}http{{ end }}
              {{- if include "faros-telemetry.tlsEnabled" . }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ if include "faros-telemetry.tlsEnabled" . }}https{{ else }}http{{ end }}
              {{- if include "faros-telemetry.tlsEnabled" . }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if include "faros-telemetry.tlsEnabled" . }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          {{- end }}
      {{- if include "faros-telemetry.tlsEnabled" . }}
      volumes:
        - name: tls
          secret:
            secretName: {{ required "tls.existingSecret is required when tls.enabled=true" .Values.tls.existingSecret }}
      {{- end }}
