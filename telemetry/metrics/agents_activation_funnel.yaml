version: 1
key_path: agents_activation_funnel
description: Independently deduplicated 28-day agent creation and successful-run stage volumes for the same resource identity; not an ordered cohort funnel.
owner: agents
product_group: agents
product_categories: [activation, runs]
value_type: number
metric_kind: funnel
status: active
time_frame: 28d
data_source: internal_events
events:
  - name: agents_agent_created
    unique: resource
    filter:
      outcome: success
  - name: agents_run_terminal
    unique: resource
    filter:
      outcome: succeeded
labels: {}
